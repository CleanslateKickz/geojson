<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Buyers List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .replit-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .replit-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .Grist-logo {
            height: 32px;
            width: auto;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="app-container">
        <!-- Main List View -->
        <div id="main-list-view">
            <div class="container mx-auto p-4 sm:p-6 lg:p-8">
                <header class="mb-8">
                    <div class="flex justify-between items-center">
                        <div>
                            <h1 class="text-4xl font-bold text-gray-900 tracking-tight">Active Buyers</h1>
                            <p class="mt-2 text-lg text-gray-600">Your curated list of commercial real estate investors.</p>
                        </div>
                        <a href="https://bs-net-lease.getgrist.com/wXgrEkoAk92P/Main-CRM" target="_blank" class="Grist-link">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Grist_Logo.svg/1024px-Grist_Logo.svg.png" alt="View on Grist" class="Grist-logo">
                            Grist
                        </a>
                    </div>
                </header>

                <!-- Action Bar -->
                <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="relative w-full sm:w-auto sm:flex-grow">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <input
                                type="text"
                                id="search-input"
                                placeholder="Search buyers, locations, property types..."
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            />
                        </div>
                        <button id="toggle-filters-btn" class="w-full sm:w-auto px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition flex items-center justify-center gap-2">
                            Filters <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="filters-container" class="hidden mt-4 pt-4 border-t border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h4 class="font-semibold mb-2 text-gray-700">Urgency Level</h4>
                            <div id="urgency-filters" class="flex flex-wrap gap-2">
                                <!-- Urgency filter chips will be inserted here -->
                            </div>
                        </div>
                        <div>
                            <h4 class="font-semibold mb-2 text-gray-700">Property Type</h4>
                            <div id="property-type-filters" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                                <!-- Property type filter chips will be inserted here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Buyer List -->
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                    <div class="hidden md:grid grid-cols-12 gap-4 px-6 py-4 bg-gray-50 border-b border-gray-200 text-sm">
                        <div class="col-span-3"><button class="sort-btn flex items-center gap-1 font-semibold text-gray-600 hover:text-gray-900 transition" data-sort-key="Buyer Name">Buyer Name</button></div>
                        <div class="col-span-3"><button class="sort-btn flex items-center gap-1 font-semibold text-gray-600 hover:text-gray-900 transition" data-sort-key="Preferred Locations">Preferred Locations</button></div>
                        <div class="col-span-2"><button class="sort-btn flex items-center gap-1 font-semibold text-gray-600 hover:text-gray-900 transition" data-sort-key="Budget Range">Budget</button></div>
                        <div class="col-span-2"><button class="sort-btn flex items-center gap-1 font-semibold text-gray-600 hover:text-gray-900 transition" data-sort-key="Urgency Level">Urgency</button></div>
                        <div class="col-span-2"></div>
                    </div>
                    <div id="buyer-list-container">
                        <!-- Buyer cards will be injected here by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail View (hidden by default) -->
        <div id="detail-view-container" class="hidden container mx-auto p-4 sm:p-6 lg:p-8">
             <!-- Detail content will be injected here -->
        </div>
    </div>

            const formatCurrency = (value) => {
                if (!value) return 'N/A';
                // Sanitize value by removing non-numeric characters except for a decimal point
                const numberValue = parseFloat(String(value).replace(/[^0-9.-]+/g,""));
                if (isNaN(numberValue)) return 'N/A';

                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0,
                }).format(numberValue);
            };

            const getUniquePropertyTypes = () => {
                const allTypes = initialData.flatMap(b => b['Preferred Property Types']?.split(/[,;]/).map(t => t.trim()) || []);
                return [...new Set(allTypes)].filter(Boolean).sort();

                buyerListContainer.innerHTML = ''; // Clear previous list

                    const lowercasedTerm = state.searchTerm.toLowerCase();
                    filtered = filtered.filter(buyer =>
                        Object.values(buyer).some(value =>

                        )
                    );
                }

                // Apply filters

                    filtered = filtered.filter(buyer => state.filters.urgency.includes(buyer['Urgency Level']));
                }
                if (state.filters.propertyType.length > 0) {
                    filtered = filtered.filter(buyer =>
                        state.filters.propertyType.some(pt => buyer['Preferred Property Types']?.toLowerCase().includes(pt.toLowerCase()))
                    );
                }

                // Apply sorting
                if (state.sortConfig.key) {
                    filtered.sort((a, b) => {
                        const aValue = a[state.sortConfig.key] || '';
                        const bValue = b[state.sortConfig.key] || '';
                        
                        if (aValue < bValue) return state.sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return state.sortConfig.direction === 'ascending' ? 1 : -1;

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

                                <div class="flex-shrink-0 w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="building" class="w-5 h-5"></i></div>
                                <div>
                                    <h4 class="font-semibold text-gray-500 text-sm uppercase tracking-wider">Preferred Property Types</h4>
                                    <div class="mt-1 text-gray-800 text-base"><p>${buyer['Preferred Property Types'] || 'N/A'}</p></div>
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-shrink-0 w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="dollar-sign" class="w-5 h-5"></i></div>
                                <div>
                                    <h4 class="font-semibold text-gray-500 text-sm uppercase tracking-wider">Budget & Pricing</h4>
                                    <div class="mt-1 text-gray-800 text-base">
                                        <p><strong>Range:</strong> ${buyer['Budget Range'] || 'Not Specified'}</p>
                                        <p><strong>Min Price:</strong> ${formatCurrency(buyer['Price Min'])}</p>
                                        <p><strong>Max Price:</strong> ${formatCurrency(buyer['Price Max'])}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-shrink-0 w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                                <div>
                                    <h4 class="font-semibold text-gray-500 text-sm uppercase tracking-wider">Preferred Locations</h4>
                                    <div class="mt-1 text-gray-800 text-base"><p>${buyer['Preferred Locations'] || 'N/A'}</p></div>
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-shrink-0 w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="star" class="w-5 h-5"></i></div>
                                <div>
                                    <h4 class="font-semibold text-gray-500 text-sm uppercase tracking-wider">Minimum Cap Rate</h4>
                                    <div class="mt-1 text-gray-800 text-base"><p>${buyer['Cap Rate Min'] || 'Not Specified'}</p></div>
                                </div>
                            </div>
                            <div class="md:col-span-2 lg:col-span-3 bg-gray-50 p-6 rounded-lg border border-gray-200">
                                <h4 class="font-semibold text-lg mb-3 text-gray-800">Notes</h4>
                                <p class="text-gray-600 leading-relaxed whitespace-pre-wrap">${buyer['Notes'] || 'N/A'}</p>
                            </div>
                        </div>
                    </div>
                `;
                mainListView.classList.add('hidden');
                detailViewContainer.classList.remove('hidden');
                lucide.createIcons();

                document.getElementById('back-to-list-btn').addEventListener('click', () => {
                    detailViewContainer.classList.add('hidden');
                    mainListView.classList.remove('hidden');
                    detailViewContainer.innerHTML = '';
                });
            };
            
            const renderFilters = () => {
                // Urgency Filters
                urgencyFiltersContainer.innerHTML = '';
                ['High', 'Moderate', 'Low'].forEach(level => {
                    const isActive = state.filters.urgency.includes(level);
                    const chip = document.createElement('button');
                    chip.className = `filter-chip px-3 py-1 text-sm rounded-full border transition ${isActive ? 'bg-blue-500 border-blue-500 text-white' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100 hover:border-gray-400'}`;
                    chip.textContent = level;
                    chip.dataset.filterType = 'urgency';
                    chip.dataset.filterValue = level;
                    urgencyFiltersContainer.appendChild(chip);
                });
                
                // Property Type Filters
                propertyTypeFiltersContainer.innerHTML = '';
                getUniquePropertyTypes().forEach(type => {
                    const isActive = state.filters.propertyType.includes(type);
                    const chip = document.createElement('button');
                    chip.className = `filter-chip px-3 py-1 text-sm rounded-full border transition ${isActive ? 'bg-blue-500 border-blue-500 text-white' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100 hover:border-gray-400'}`;
                    chip.textContent = type;
                    chip.dataset.filterType = 'propertyType';
                    chip.dataset.filterValue = type;
                    propertyTypeFiltersContainer.appendChild(chip);
                });
            };
            
            const updateSortHeaders = () => {
                document.querySelectorAll('.sort-btn').forEach(btn => {
                    const sortKey = btn.dataset.sortKey;
                    let iconHtml = '';
                    if (state.sortConfig.key === sortKey) {
                        const icon = state.sortConfig.direction === 'ascending' ? 'chevron-up' : 'chevron-down';
                        iconHtml = `<i data-lucide="${icon}" class="w-4 h-4"></i>`;
                    }
                    btn.innerHTML = `${btn.textContent.split(' ')[0]} ${iconHtml}`;
                });
                lucide.createIcons();
            };

            // --- EVENT LISTENERS ---
            searchInput.addEventListener('input', (e) => {
                state.searchTerm = e.target.value;
                renderBuyers();
            });

            toggleFiltersBtn.addEventListener('click', () => {
                const isHidden = filtersContainer.classList.toggle('hidden');
                toggleFiltersBtn.innerHTML = `Filters <i data-lucide="${isHidden ? 'chevron-down' : 'chevron-up'}" class="w-4 h-4"></i>`;
                lucide.createIcons();
            });
            
            document.addEventListener('click', (e) => {
                // Handle filter chip clicks
                if (e.target.classList.contains('filter-chip')) {
                    const { filterType, filterValue } = e.target.dataset;
                    const currentValues = state.filters[filterType];
                    if (currentValues.includes(filterValue)) {
                        state.filters[filterType] = currentValues.filter(v => v !== filterValue);
                    } else {
                        state.filters[filterType].push(filterValue);
                    }
                    renderFilters(); // Re-render to update active styles
                    renderBuyers(); // Re-render the buyer list
                }

                // Handle sort button clicks
                if (e.target.closest('.sort-btn')) {
                    const btn = e.target.closest('.sort-btn');
                    const key = btn.dataset.sortKey;
                    let direction = 'ascending';
                    if (state.sortConfig.key === key && state.sortConfig.direction === 'ascending') {
                        direction = 'descending';
                    }
                    state.sortConfig = { key, direction };
                    renderBuyers();
                }

                // Handle buyer card clicks for detail view
                const card = e.target.closest('.buyer-card');
                if (card) {
                    const buyerIndex = parseInt(card.dataset.buyerIndex, 10);
                    const selectedBuyer = initialData[buyerIndex];
                    if (selectedBuyer) {
                        renderDetailView(selectedBuyer);
}
}
});

// --- INITIALIZATION ---
// Clean up data before initial render
initialData.forEach(buyer => {
// Example of cleaning a field: ensure Urgency Level is valid
const validUrgencies = ['High', 'Moderate', 'Low'];
if (!validUrgencies.includes(buyer['Urgency Level'])) {
buyer['Urgency Level'] = ''; // or a default value
}
});

renderFilters();
renderBuyers();
lucide.createIcons();
});
</script>
</body>
