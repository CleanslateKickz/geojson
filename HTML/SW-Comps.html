            // Function to parse the raw data string into a structured array of objects
            function parseData(dataString) {
                const lines = dataString.trim().split('\n');
                const headersLine = lines[0].trim();
                const dataRows = lines.slice(2);

                const headers = headersLine.split('|').map(h => h.trim()).filter(h => h !== '');

                const parsedProperties = [];

                dataRows.forEach(rowString => {
                    let imgUrl = '';
                    let remainingRowString = rowString;

                    // Find the index of the second pipe to correctly isolate the IMG column content
                    const firstPipeIndex = remainingRowString.indexOf('|');
                    const secondPipeIndex = remainingRowString.indexOf('|', firstPipeIndex + 1);

                    if (firstPipeIndex !== -1 && secondPipeIndex !== -1) {
                        const imgColumnContent = remainingRowString.substring(firstPipeIndex + 1, secondPipeIndex).trim(); // Get content between first and second pipe
                        remainingRowString = remainingRowString.substring(secondPipeIndex); // The rest of the string, starting from the second pipe

                        const urlMatch = imgColumnContent.match(/https?:\/\/[^\s<>\])]+/);
                        if (urlMatch) {
                            imgUrl = urlMatch[0];
                        }
                    }

                    // Now split the remaining string by '|' and process values
                    let values = remainingRowString.split('|').map(v => v.trim());

                    // Remove empty strings from start/end due to splitting on leading/trailing pipes
                    if (values.length > 0 && values[0] === '') {
                        values = values.slice(1);
                    }
                    if (values.length > 0 && values[values.length - 1] === '') {
                        values = values.slice(0, -1);
                    }

                    // Add the extracted image URL as the first value (corresponding to the 'IMG' header)
                    values.unshift(imgUrl);

                    // Ensure the number of values matches the number of headers
                    while (values.length < headers.length) {
                        values.push('');
                    }
                    values = values.slice(0, headers.length); // Truncate if too many values

                    const property = {};
                    headers.forEach((header, index) => {
                        property[header] = values[index];
                    });
                    parsedProperties.push(property);
                });
                return parsedProperties;
            }

            const properties = parseData(rawData);

            // Group properties by tenant
            const groupedProperties = properties.reduce((acc, property) => {
                const tenant = property.Tenant;
                if (!acc[tenant]) {
                    acc[tenant] = [];
                }
                acc[tenant].push(property);
                return acc;
            }, {});

            // Function to render property details
            function renderProperty(property) {
                // Helper to safely get value and handle empty strings
                const getDetail = (label, key) => property[key] && property[key].trim() !== '' ? `
                    <div class="detail-item">
                        <span class="detail-label">${label}:</span>
                        <span class="detail-value">${property[key]}</span>
                    </div>
                ` : '';

                return `
                    <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 mb-6 flex flex-col md:flex-row items-start md:items-center transform hover:scale-105 transition-transform duration-300 ease-in-out">
                        ${property.IMG ? `
                            <div class="md:w-1/3 w-full mb-4 md:mb-0 md:mr-6 flex-shrink-0">
                                <img src="${property.IMG}" alt="${property.Tenant} Property" class="w-full h-48 object-cover rounded-lg shadow-sm" onerror="this.onerror=null;this.src='https://placehold.co/600x400/E0E7FF/4338CA?text=Image+Not+Found';">
                            </div>
                        ` : `
                            <div class="md:w-1/3 w-full mb-4 md:mb-0 md:mr-6 flex-shrink-0">
                                <div class="w-full h-48 bg-gray-200 rounded-lg flex items-center justify-center text-gray-500 text-center">No Image Available</div>
                            </div>
                        `}
                        <div class="md:w-2/3 w-full">
                            <h3 class="text-xl sm:text-2xl font-bold text-gray-900 mb-1">
                                ${property.Price || 'N/A'} | ${property.Cap || 'N/A'}
                            </h3>
                            <p class="text-lg text-gray-600 mb-3">${property.Address || 'N/A'}</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4 text-gray-700">
                                ${getDetail('$/SF', '$/SF')}
                                ${getDetail('Sale Date', 'Date')}
                                ${getDetail('Building Size', 'Building Size')}
                                ${getDetail('Year Built', 'Year Built')}
                                ${getDetail('Days On Market', 'Days On Market')}
                            </div>
                            ${property.Notes && property.Notes.trim() !== '' ? `
                                <div class="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-md shadow-sm">
                                    <p class="text-sm font-medium text-blue-800">Notes:</p>
                                    <p class="text-sm text-blue-700 mt-1">${property.Notes}</p>
                                </div>
                            ` : `
                                <div class="bg-gray-50 border-l-4 border-gray-300 p-4 rounded-md shadow-sm">
                                    <p class="text-sm font-medium text-gray-600">No specific notes available for this property.</p>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            // Render the grouped properties
            document.addEventListener('DOMContentLoaded', () => {
                const appContainer = document.getElementById('app-container');
                let htmlContent = '';

                for (const tenant in groupedProperties) {
                    htmlContent += `
                        <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mt-10 mb-6 border-b-2 border-gray-300 pb-2">
                            ${tenant} Properties
            </h2>
                        <div class="grid grid-cols-1 gap-6">
                    `;
                    groupedProperties[tenant].forEach(property => {
                        htmlContent += renderProperty(property);
                    });
                    htmlContent += `</div>`;
                }

                appContainer.innerHTML = htmlContent;
            });
        </script>

        <div id="app-container">
            <!-- Properties will be rendered here by JavaScript -->
        </div>
    </div>
