<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Formatter</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Config for nicer fonts/colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Smooth transitions for interactive elements */
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
      min-height: 100vh;
    }
    
    .input-transition {
      transition: all 0.2s ease-in-out;
    }

    /* Copy success animation */
    @keyframes check-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .animate-check {
      animation: check-pop 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Icons as components for cleaner JSX
    const ResetIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const CopyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
    );

    const CheckIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor">
        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
      </svg>
    );

    function App() {
      const [tenantName, setTenantName] = useState('');
      const [address, setAddress] = useState('');
      const [copied, setCopied] = useState(false);
      
      // Ref for the address input to manage cursor if we programmatically set value
      const addressInputRef = useRef(null);

      const formatAddress = (input) => {
        if (!input) return '';

        // 1. Remove ZIP code (5 digits or 5+4 format) at the end
        let cleaned = input.replace(/\s*\b\d{5}(-\d{4})?\b\s*$/, '').trim();
        
        // 2. Standardize spacing and commas
        cleaned = cleaned.replace(/\s{2,}/g, ' ').replace(/,+/g, ',').replace(/,\s*$/, '');
        
        // 3. Common address abbreviations dictionary
        const abbreviations = {
          'north': 'N', 'south': 'S', 'east': 'E', 'west': 'W',
          'northeast': 'NE', 'northwest': 'NW', 'southeast': 'SE', 'southwest': 'SW',
          'street': 'St', 'avenue': 'Ave', 'boulevard': 'Blvd', 'drive': 'Dr',
          'lane': 'Ln', 'road': 'Rd', 'court': 'Ct', 'place': 'Pl',
          'circle': 'Cir', 'terrace': 'Ter', 'highway': 'Hwy', 'parkway': 'Pkwy',
          'apartment': 'Apt', 'suite': 'Ste', 'unit': 'Unit', 'room': 'Rm', 'floor': 'Fl',
          'number': '#', 'building': 'Bldg',
        };
        
        // 4. Apply abbreviations (case-insensitive)
        for (const [full, abbrev] of Object.entries(abbreviations)) {
          const regex = new RegExp(`\\b${full}\\b`, 'gi');
          cleaned = cleaned.replace(regex, abbrev);
        }
        
        // 5. Capitalize words
        const words = cleaned.split(' ');
        const capitalizedWords = words.map(word => {
          // Keep all-caps abbreviations (N, SW, CA) or short codes as is
          if (/^[A-Z]{1,4}$/.test(word)) return word;
          // Capitalize first letter of regular words
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        });
        
        return capitalizedWords.join(' ');
      };

      const handleAddressChange = (e) => {
        let newValue = e.target.value;
        
        // --- SMART COMMA LOGIC ---
        // If there are no commas in the input, we check if it looks like 
        // "StreetName City, State" and insert a comma after the street.
        
        if (!newValue.includes(',')) {
          // Regex looks for:
          // 1. A word boundary followed by a street suffix (Hwy, St, Ave, etc.) - case insensitive
          // 2. Followed by one or more spaces
          // 3. Followed by a Capitalized word (start of city)
          // Example match: "... Hwy Nashua"
          const streetSuffixRegex = /\b(St|Ave|Blvd|Rd|Ln|Dr|Ct|Pl|Cir|Ter|Hwy|Pkwy|Way)\s+([A-Z][a-z]+)/i;
          
          // Only apply if we found a match. 
          // We replace "Hwy Nashua" with "Hwy, Nashua"
          if (streetSuffixRegex.test(newValue)) {
            newValue = newValue.replace(streetSuffixRegex, '$1, $2');
          }
        }

        setAddress(newValue);
      };

      const formatOutput = () => {
        if (tenantName && address) {
          const formattedAddress = formatAddress(address);
          return `(${tenantName}) ${formattedAddress}`;
        }
        return '';
      };

      const output = formatOutput();

      const handleCopy = () => {
        if (output) {
          navigator.clipboard.writeText(output).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          }).catch(err => console.error('Failed to copy: ', err));
        }
      };

      const handleReset = () => {
        setTenantName('');
        setAddress('');
        setCopied(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            
            {/* Header Section with Reset Button */}
            <div className="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-white">
              <h1 className="text-2xl font-bold text-gray-800 tracking-tight">
                Property Formatter
              </h1>
              <button
                onClick={handleReset}
                className="group flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-1"
                title="Clear all fields"
              >
                <ResetIcon />
                <span>Reset</span>
              </button>
            </div>

            <div className="p-8 space-y-6">
              {/* Tenant Input */}
              <div className="space-y-2">
                <label htmlFor="tenant" className="block text-sm font-medium text-gray-700">
                  Tenant / Property Name
                </label>
                <div className="relative">
                  <input
                    id="tenant"
                    type="text"
                    placeholder="e.g. Smith Properties LLC"
                    value={tenantName}
                    onChange={(e) => setTenantName(e.target.value)}
                    className="input-transition w-full p-3 pl-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent shadow-sm"
                  />
                </div>
              </div>

              {/* Address Input */}
              <div className="space-y-2">
                <label htmlFor="address" className="block text-sm font-medium text-gray-700">
                  Property Address
                </label>
                <div className="relative">
                  <input
                    ref={addressInputRef}
                    id="address"
                    type="text"
                    placeholder="e.g. 272 Daniel Webster Hwy, Nashua, NH 03060"
                    value={address}
                    onChange={handleAddressChange}
                    className="input-transition w-full p-3 pl-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent shadow-sm"
                  />
                  {/* Helper text for the auto-comma feature */}
                  <p className="text-xs text-gray-400 mt-1.5 pl-1">
                    Tip: Pasting separate parts? We'll auto-add commas if needed.
                  </p>
                </div>
              </div>

              {/* Output Preview Card */}
              <div 
                className={`
                  relative mt-6 p-5 rounded-xl border-2 border-dashed text-center transition-all duration-300 cursor-pointer
                  ${output 
                    ? 'bg-brand-50 border-brand-200 hover:bg-brand-100 hover:border-brand-300 group' 
                    : 'bg-gray-50 border-gray-200 cursor-default'
                  }
                `}
                onClick={handleCopy}
                title={output ? "Click to copy" : ""}
              >
                <div className="text-gray-500 text-xs font-semibold uppercase tracking-wider mb-2">
                  Preview
                </div>
                <p className={`text-lg font-medium ${output ? 'text-gray-800' : 'text-gray-400'}`}>
                  {output || 'Start typing to see the formatted result'}
                </p>
                
                {output && (
                  <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity text-brand-600">
                    <CopyIcon />
                  </div>
                )}
              </div>
            </div>

            {/* Footer Action */}
            <div className="px-8 py-6 bg-gray-50 border-t border-gray-100">
              <button
                onClick={handleCopy}
                disabled={!output}
                className={`
                  w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-bold text-base shadow-sm transition-all duration-200
                  ${output 
                    ? 'bg-brand-600 text-white hover:bg-brand-700 hover:shadow-md active:scale-[0.98]' 
                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                  }
                `}
              >
                {copied ? (
                  <>
                    <span className={`inline-flex items-center ${copied ? 'animate-check' : ''}`}>
                      <CheckIcon />
                    </span>
                    Copied to Clipboard!
                  </>
                ) : (
                  <>
                    <CopyIcon />
                    Copy Formatted String
                  </>
                )}
              </button>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
