<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Geocoding Progress Dashboard</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
      color: #2d3748;
    }

    .dashboard-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: white;
      flex-shrink: 0;
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex-shrink: 0;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a202c;
    }

    .progress-section {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label {
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
    }

    .progress-percentage {
      font-size: 18px;
      font-weight: 700;
      color: #4f46e5;
    }

    .progress-bar-container {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      flex: 1;
    }

    .metric-box {
      text-align: center;
      padding: 16px 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    /* Tenant Status Section */
    .tenant-status-container {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .tenant-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tenant-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .tenant-card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a202c;
    }

    .tenant-count {
      font-size: 12px;
      color: #64748b;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .tenant-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .tenant-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tenant-item.complete {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    .tenant-item.partial {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }

    .tenant-item.incomplete {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .tenant-name {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      flex: 1;
      margin-right: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tenant-progress {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .tenant-progress.complete {
      color: #059669;
    }

    .tenant-progress.partial {
      color: #d97706;
    }

    .tenant-progress.incomplete {
      color: #dc2626;
    }

    .status-icon {
      font-size: 12px;
    }

    .dashboard-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: white;
      font-size: 13px;
      flex-shrink: 0;
    }

    .refresh-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .refresh-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 16px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-state {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #dc2626;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: 500;
      font-size: 14px;
    }

    /* Custom scrollbar for tenant lists */
    .tenant-list::-webkit-scrollbar {
      width: 4px;
    }

    .tenant-list::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 2px;
    }

    .tenant-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 2px;
    }

    .tenant-list::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .stats-container,
      .tenant-status-container {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .dashboard-container {
        padding: 12px;
        gap: 12px;
      }
      
      .stat-card,
      .tenant-card {
        padding: 20px;
      }
      
      .metrics-grid {
        gap: 8px;
      }
      
      .metric-value {
        font-size: 18px;
      }
    }

    @media (max-height: 700px) {
      .dashboard-container {
        padding: 12px;
        gap: 12px;
      }
      
      .stat-card,
      .tenant-card {
        padding: 16px;
      }
      
      .progress-section {
        margin-bottom: 16px;
      }
      
      .metric-box {
        padding: 12px 8px;
      }
      
      .metric-value {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <span class="header-icon">🌍</span>
      <h1 class="header-title">Geocoding Progress Dashboard</h1>
    </div>

    <div id="loadingState" class="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading data...</div>
    </div>

    <div id="content" class="main-content" style="display: none;">
      <div class="stats-container">
        <div class="stat-card">
          <div class="card-header">
            <div class="card-icon">🏢</div>
            <div class="card-title">CoStarExport</div>
          </div>
          
          <div class="progress-section">
            <div class="progress-header">
              <span class="progress-label">Geocoding Progress</span>
              <span class="progress-percentage"><span id="costar-percent">0</span>%</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar" id="costar-progress" style="width: 0%"></div>
            </div>
          </div>

          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-value" id="costar-total">0</div>
              <div class="metric-label">Total Properties</div>
            </div>
            <div class="metric-box">
              <div class="metric-value" id="costar-complete">0</div>
              <div class="metric-label">Geocoded</div>
            </div>
            <div class="metric-box">
              <div class="metric-value" id="costar-missing">0</div>
              <div class="metric-label">Remaining</div>
            </div>
          </div>
        </div>

        <div class="stat-card">
          <div class="card-header">
            <div class="card-icon">📍</div>
            <div class="card-title">Locations</div>
          </div>
          
          <div class="progress-section">
            <div class="progress-header">
              <span class="progress-label">Geocoding Progress</span>
              <span class="progress-percentage"><span id="locations-percent">0</span>%</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar" id="locations-progress" style="width: 0%"></div>
            </div>
          </div>

          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-value" id="locations-total">0</div>
              <div class="metric-label">Total Locations</div>
            </div>
            <div class="metric-box">
              <div class="metric-value" id="locations-complete">0</div>
              <div class="metric-label">Geocoded</div>
            </div>
            <div class="metric-box">
              <div class="metric-value" id="locations-missing">0</div>
              <div class="metric-label">Remaining</div>
            </div>
          </div>
        </div>
      </div>

      <div class="tenant-status-container">
        <div class="tenant-card">
          <div class="tenant-card-header">
            <div class="tenant-card-title">CoStar Tenants</div>
            <div class="tenant-count" id="costar-tenant-count">0 tenants</div>
          </div>
          <div class="tenant-list" id="costar-tenant-list">
            <!-- Tenant items will be populated here -->
          </div>
        </div>

        <div class="tenant-card">
          <div class="tenant-card-header">
            <div class="tenant-card-title">Location Tenants</div>
            <div class="tenant-count" id="locations-tenant-count">0 tenants</div>
          </div>
          <div class="tenant-list" id="locations-tenant-list">
            <!-- Tenant items will be populated here -->
          </div>
        </div>
      </div>

      <div class="dashboard-footer">
        <span>Last updated: <span id="last-updated">-</span></span>
        <button class="refresh-btn" id="refresh-btn">
          <span>⟳</span> Refresh
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // DOM elements
      const loadingEl = document.getElementById('loadingState');
      const contentEl = document.getElementById('content');
      const lastUpdatedEl = document.getElementById('last-updated');
      const refreshBtn = document.getElementById('refresh-btn');

      // Number formatting function with commas
      function formatNumber(num) {
        return num.toLocaleString();
      }

      // Convert columnar data to row format
      function columnarToRowFormat(columnarData) {
        if (!columnarData?.id) return [];
        return columnarData.id.map((id, index) => ({
          id,
          fields: Object.fromEntries(
            Object.entries(columnarData)
              .filter(([key]) => !['id', 'manualSort'].includes(key))
              .map(([key, values]) => [key, values[index]])
          )
        }));
      }

      // Analyze tenant completion status
      function analyzeTenantStatus(records, tenantField, lonField, latField) {
        const tenantStats = {};
        
        records.forEach(record => {
          const tenant = record.fields[tenantField];
          if (!tenant) return;
          
          if (!tenantStats[tenant]) {
            tenantStats[tenant] = { total: 0, geocoded: 0 };
          }
          
          tenantStats[tenant].total++;
          
          const lon = record.fields[lonField];
          const lat = record.fields[latField];
          if (typeof lon === 'number' && typeof lat === 'number' && lon !== 0 && lat !== 0) {
            tenantStats[tenant].geocoded++;
          }
        });

        // Convert to array and add completion percentage
        return Object.entries(tenantStats)
          .map(([tenant, stats]) => ({
            name: tenant,
            total: stats.total,
            geocoded: stats.geocoded,
            remaining: stats.total - stats.geocoded,
            percentage: Math.round((stats.geocoded / stats.total) * 100)
          }))
          .sort((a, b) => b.percentage - a.percentage || a.name.localeCompare(b.name));
      }

      // Update tenant list UI
      function updateTenantList(containerId, countId, tenants) {
        const container = document.getElementById(containerId);
        const countEl = document.getElementById(countId);
        
        countEl.textContent = `${tenants.length} tenants`;
        
        container.innerHTML = tenants.map(tenant => {
          let statusClass, statusIcon;
          if (tenant.percentage === 100) {
            statusClass = 'complete';
            statusIcon = '✅';
          } else if (tenant.percentage > 0) {
            statusClass = 'partial';
            statusIcon = '🔄';
          } else {
            statusClass = 'incomplete';
            statusIcon = '❌';
          }
          
          return `
            <div class="tenant-item ${statusClass}">
              <div class="tenant-name" title="${tenant.name}">${tenant.name}</div>
              <div class="tenant-progress ${statusClass}">
                <span class="status-icon">${statusIcon}</span>
                ${tenant.geocoded}/${tenant.total} (${tenant.percentage}%)
              </div>
            </div>
          `;
        }).join('');
      }

      // Initialize dashboard
      async function initDashboard() {
        try {
          refreshBtn.disabled = true;
          showLoading();

          // Fetch data from both tables
          const [costarData, locationsData] = await Promise.all([
            grist.docApi.fetchTable('CoStarExport'),
            grist.docApi.fetchTable('Locations')
          ]);

          const costarRecords = columnarToRowFormat(costarData);
          const locationsRecords = columnarToRowFormat(locationsData);

          // Calculate overall stats
          const costar = calculateStats(costarRecords, 'Longitude', 'Latitude');
          const locations = calculateStats(locationsRecords, 'Long', 'Lat');

          // Analyze tenant status
          const costarTenants = analyzeTenantStatus(costarRecords, 'Tenant_Name', 'Longitude', 'Latitude');
          const locationsTenants = analyzeTenantStatus(locationsRecords, 'Tenant', 'Long', 'Lat');

          updateUI(costar, locations);
          updateTenantList('costar-tenant-list', 'costar-tenant-count', costarTenants);
          updateTenantList('locations-tenant-list', 'locations-tenant-count', locationsTenants);
          
          lastUpdatedEl.textContent = new Date().toLocaleTimeString();
          
        } catch (error) {
          console.error('Dashboard init failed:', error);
          showError(error.message);
        } finally {
          hideLoading();
          refreshBtn.disabled = false;
        }
      }

      // Calculate basic stats
      function calculateStats(records, lonField, latField) {
        let geocoded = 0;
        for (const record of records) {
          const lon = record.fields[lonField];
          const lat = record.fields[latField];
          if (typeof lon === 'number' && typeof lat === 'number' && lon !== 0 && lat !== 0) {
            geocoded++;
          }
        }

        return {
          total: records.length,
          geocoded,
          missing: records.length - geocoded,
          percentage: records.length ? Math.round((geocoded / records.length) * 100) : 0
        };
      }

      // Update UI with formatted numbers
      function updateUI(costar, locations) {
        // CoStarExport updates with comma formatting
        document.getElementById('costar-total').textContent = formatNumber(costar.total);
        document.getElementById('costar-complete').textContent = formatNumber(costar.geocoded);
        document.getElementById('costar-missing').textContent = formatNumber(costar.missing);
        document.getElementById('costar-percent').textContent = costar.percentage;
        document.getElementById('costar-progress').style.width = `${costar.percentage}%`;

        // Locations updates with comma formatting
        document.getElementById('locations-total').textContent = formatNumber(locations.total);
        document.getElementById('locations-complete').textContent = formatNumber(locations.geocoded);
        document.getElementById('locations-missing').textContent = formatNumber(locations.missing);
        document.getElementById('locations-percent').textContent = locations.percentage;
        document.getElementById('locations-progress').style.width = `${locations.percentage}%`;
      }

      function showLoading() {
        loadingEl.style.display = 'flex';
        contentEl.style.display = 'none';
      }

      function hideLoading() {
        loadingEl.style.display = 'none';
        contentEl.style.display = 'flex';
      }

      function showError(message) {
        loadingEl.innerHTML = `
          <div class="error-state">
            <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
            <div>Error: ${message}</div>
          </div>
        `;
      }

      // Initialize when Grist is ready
      grist.ready({
        requiredAccess: 'full',
        columns: [] // No columns needed for summary data
      });

      // Event listeners
      refreshBtn.addEventListener('click', initDashboard);

      // Initialize dashboard
      initDashboard();
    });
  </script>
</body>
</html>
