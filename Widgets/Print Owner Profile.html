</style>
</head>
<body>
<div class="no-print print-bar">
    <span>📄 ${ownerName} — Owner Profile Report &nbsp;·&nbsp; ${reportDate}</span>
    <button class="print-bar-btn" onclick="window.print()">⬇ Save as PDF</button>
</div>

<div class="report-header">
    <div class="report-avatar">
        ${profileImgSrc
            ? `<img src="${profileImgSrc}" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=report-avatar-initials>${(ownerName.split(' ').map(n=>n[0]).join('').toUpperCase().substring(0,2))}</div>'">`
            : `<div class="report-avatar-initials">${ownerName.split(' ').map(n=>n[0]).join('').toUpperCase().substring(0,2)}</div>`}
    </div>
    <div>
        <div class="report-name">${ownerName}</div>
        <div class="report-sub">${subLine || 'Owner Profile'}</div>
    </div>
    <div class="report-date">Owner Portfolio Report<br>${reportDate}</div>
</div>

<div class="report-body">

    ${opportunityTags ? `<div style="margin-bottom:10px;">${opportunityTags}</div>` : ''}

    ${statsData.length ? `
    <div class="r-section">
        <div class="r-section-header">
            <div class="r-section-dot"></div>
            <div class="r-section-title">Overview</div>
        </div>
        <div class="stats-grid">${statsHTML}</div>
    </div>` : ''}

    <div class="r-section">
        <div class="r-section-header">
            <div class="r-section-dot"></div>
            <div class="r-section-title">Property Portfolio</div>
            <div class="r-section-badge">${ownerProperties.length} Properties</div>
        </div>
        ${propsHTML}
    </div>

    ${notes.length ? `
    <div class="r-section">
        <div class="r-section-header">
            <div class="r-section-dot"></div>
            <div class="r-section-title">Activity Log</div>
        </div>
        ${activityHTML}
    </div>` : ''}

</div>

<div class="report-footer no-print">
    <div class="footer-brand">Market Analytics Advisory</div>
    <div style="font-size:10px;color:#94a3b8;">Generated ${reportDate}</div>
</div>

</body>
</html>`;
            }

            // ── SREO EXPORT — Schedule of Real Estate Owned ──
            DOM.btnSREO.addEventListener('click', async () => {
                if (!currentRecord) return;

                const originalBtnHTML = DOM.btnSREO.innerHTML;
                DOM.btnSREO.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
                DOM.btnSREO.disabled = true;

                try {
                    const name = currentRecord.Name || currentRecord.Owner_Full_Name || 'Unknown';
                    const printHTML = buildSREODocument(name);

                    const printWin = window.open('', '_blank', `width=${Math.min(screen.width, 1200)},height=${Math.min(screen.height, 900)},left=0,top=0`);
                    if (!printWin) {
                        alert('Pop-up blocked. Please allow pop-ups for this page and try again.');
                        return;
                    }

                    printWin.document.write(printHTML);
                    printWin.document.close();

                    pmShowToast('SREO print preview opened — use "Save as PDF" in the print dialog', 'success', 4000);

                    printWin.addEventListener('load', () => {
                        setTimeout(() => {
                            printWin.focus();
                            printWin.print();
                            setTimeout(() => { try { printWin.close(); } catch(e) {} }, 3000);
                        }, 400);
                    });

                    setTimeout(() => {
                        try {
                            if (!printWin.closed) {
                                printWin.focus();
                                printWin.print();
                            }
                        } catch(e) {}
                    }, 2500);

                } catch(e) {
                    console.error("SREO Print Error", e);
                    alert("Error generating SREO print view: " + e.message);
                } finally {
                    DOM.btnSREO.innerHTML = originalBtnHTML;
                    DOM.btnSREO.disabled = false;
                }
            });

            // ── Build SREO Document HTML ──
            function buildSREODocument(ownerName) {
                const r = currentRecord;
                const accounts = getList(r.Accounts).join(', ');
                const title = r.Title || '';
                const segment = firstItem(r.Segment) || '';
                const classify = firstItem(r.Classify) || '';
                const reportDate = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

                const sortedProps = [...ownerProperties].sort((a, b) => {
                    const da = a.fields.Last_Sale_Date ? new Date(a.fields.Last_Sale_Date).getTime() : Infinity;
                    const db = b.fields.Last_Sale_Date ? new Date(b.fields.Last_Sale_Date).getTime() : Infinity;
                    return da - db;
                });

                const propRows = sortedProps.map((p, i) => {
                    const f = p.fields;
                    const street = f.Property_Address || '';
                    const city = f.City || '';
                    const state = f.State || '';
                    const zip = f.Zip || '';
                    const fullAddress = [street, city, state, zip].filter(Boolean).join(', ');
                    const propName = f.Property_Name || fullAddress || 'Property';
                    
                    // Remove emojis from type strings
                    const removeEmojis = (str) => {
                        if (!str) return '';
                        return str.replace(/[\u{1F000}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F300}-\u{1F5FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
                    };
                    const typeStr = [removeEmojis(firstItem(f.Property_Type)), removeEmojis(firstItem(f.Secondary_Type))].filter(Boolean).join(' / ');
                    
                    const purchaseDate = formatDate(f.Last_Sale_Date);
                    const purchasePrice = formatMoney(f.Last_Sale_Price);
                    const tenants = getList(f.Tenants).join(', ') || '—';
                    const rba = f.RBA ? Number(f.RBA).toLocaleString() + ' SF' : '—';

                    return `<tr>
                        <td style="text-align:center;color:#94a3b8;font-weight:600;">${i + 1}</td>
                        <td>
                            <div style="font-weight:600;color:#0f172a;font-size:12px;">${propName}</div>
                            <div style="font-size:10px;color:#64748b;margin-top:2px;">${fullAddress || '—'}</div>
                        </td>
                        <td style="font-size:11px;color:#475569;">${typeStr || '—'}</td>
                        <td style="font-size:11px;color:#475569;text-align:right;">${rba}</td>
                        <td style="font-size:11px;color:#475569;">${purchaseDate || '—'}</td>
                        <td style="font-size:11px;color:#0f172a;font-weight:600;text-align:right;">${purchasePrice}</td>
                        <td style="font-size:11px;color:#475569;">${tenants}</td>
                    </tr>`;
                }).join('');

                const totalProperties = sortedProps.length;
                const totalValue = sortedProps.reduce((sum, p) => {
                    const v = parseFloat(p.fields.Last_Sale_Price);
                    return sum + (isNaN(v) ? 0 : v);
                }, 0);
                const totalValueFormatted = '$' + totalValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                // Parse accounts by semicolon (not whitespace) to keep multi-word account names intact
                const accountsList = r.Accounts
                    ? String(r.Accounts).split(';').map(a => a.trim()).filter(Boolean)
                    : [];
                const accountsHTML = accountsList.length
                    ? accountsList.map(a => `<li style="padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px;color:#0f172a;">${a}</li>`).join('')
                    : '<li style="padding:6px 0;font-size:12px;color:#94a3b8;font-style:italic;">No accounts on file</li>';

                return buildSREOHTML(ownerName, r, accounts, title, segment, classify, reportDate, propRows, totalProperties, totalValue, totalValueFormatted, accountsHTML);
            }

            // ── Build SREO HTML Template ──
            function buildSREOHTML(ownerName, r, accounts, title, segment, classify, reportDate, propRows, totalProperties, totalValue, totalValueFormatted, accountsHTML) {
                const subLine = [accounts, title].filter(Boolean).join(' · ');
                const hasProps = totalProperties > 0;

                return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SREO — ${ownerName}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    @page { size: letter portrait; margin: 0.5in 0.5in; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { font-family: 'Inter', system-ui, sans-serif; background: white; color: #0f172a; font-size: 12px; line-height: 1.5; }

    .no-print { display: block; }
    @media print { .no-print { display: none !important; } }

    .print-bar {
        background: #1e3a8a; color: white; padding: 10px 20px;
        display: flex; align-items: center; justify-content: space-between;
        font-size: 13px; font-weight: 600; gap: 12px;
        position: sticky; top: 0; z-index: 100;
    }
    .print-bar-btn {
        background: white; color: #1e3a8a; border: none; padding: 6px 16px;
        border-radius: 5px; font-weight: 700; font-size: 12px; cursor: pointer;
        font-family: inherit; flex-shrink: 0;
    }
    .print-bar-btn:hover { background: #dbeafe; }

    .report-header {
        border-bottom: 3px solid #1e3a8a;
        padding: 18px 0 14px 0;
        margin-bottom: 18px;
    }
    .report-title {
        font-size: 11px; font-weight: 700; color: #1e3a8a;
        text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px;
    }
    .report-name {
        font-size: 22px; font-weight: 800; color: #0f172a;
        letter-spacing: -0.02em; margin-bottom: 3px;
    }
    .report-sub {
        font-size: 12px; color: #64748b; font-weight: 500;
    }
    .report-meta {
        display: flex; gap: 20px; margin-top: 10px;
        font-size: 10px; color: #94a3b8; text-transform: uppercase;
        letter-spacing: 0.5px; font-weight: 600;
    }
    .report-meta span strong { color: #475569; font-weight: 700; }

    .report-body { padding: 0; }

    .summary-grid {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 10px; margin-bottom: 22px;
    }
    .summary-box {
        background: #f8fafc; border: 1px solid #e2e8f0;
        border-radius: 6px; padding: 10px 12px;
    }
    .summary-label {
        font-size: 9px; color: #94a3b8; text-transform: uppercase;
        font-weight: 700; letter-spacing: 0.5px; margin-bottom: 3px;
    }
    .summary-value {
        font-size: 14px; font-weight: 700; color: #0f172a;
    }
    .summary-value.accent { color: #1e3a8a; }

    .section-title {
        font-size: 11px; font-weight: 700; color: #1e3a8a;
        text-transform: uppercase; letter-spacing: 1px;
        margin-bottom: 8px; padding-bottom: 5px;
        border-bottom: 1px solid #e2e8f0;
    }

    table.sreo-table {
        width: 100%; border-collapse: collapse;
        margin-bottom: 14px; font-size: 11px;
    }
    table.sreo-table thead th {
        background: #1e3a8a; color: white;
        padding: 8px 10px; text-align: left;
        font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.5px;
    }
    table.sreo-table thead th:first-child { text-align: center; width: 32px; }
    table.sreo-table thead th:nth-child(4),
    table.sreo-table thead th:nth-child(6) { text-align: right; }
    table.sreo-table tbody td {
        padding: 9px 10px; border-bottom: 1px solid #f1f5f9;
        vertical-align: top;
    }
    table.sreo-table tbody tr:nth-child(even) { background: #fafbfc; }
    table.sreo-table tbody tr:hover { background: #f1f5f9; }

    .totals-row td {
        background: #1e3a8a !important; color: white !important;
        font-weight: 700; padding: 10px;
    }

    .empty-msg {
        text-align: center; padding: 24px;
        color: #94a3b8; font-style: italic;
        background: #f8fafc; border: 1px dashed #cbd5e1;
        border-radius: 6px; font-size: 12px;
    }

    .accounts-list {
        list-style: none; padding: 0; margin: 0;
        border: 1px solid #e2e8f0; border-radius: 6px;
        overflow: hidden;
    }
    .accounts-list li:last-child { border-bottom: none !important; }

    .report-footer {
        margin-top: 28px; padding-top: 12px;
        border-top: 1px solid #e2e8f0;
        display: flex; justify-content: space-between;
        font-size: 9px; color: #94a3b8;
        text-transform: uppercase; letter-spacing: 0.5px;
        font-weight: 600;
    }
</style>
</head>
<body>
<div class="no-print print-bar">
    <span>📋 SREO — ${ownerName} &nbsp;·&nbsp; ${reportDate}</span>
    <button class="print-bar-btn" onclick="window.print()">⬇ Save as PDF</button>
</div>

<div class="report-header">
    <div class="report-title">Schedule of Real Estate Owned</div>
    <div class="report-name">${ownerName}</div>
    <div class="report-sub">${subLine || 'Real Estate Portfolio'}</div>
    <div class="report-meta">
        <span>Report Date: <strong>${reportDate}</strong></span>
        ${segment ? `<span>Segment: <strong>${segment}</strong></span>` : ''}
        ${classify ? `<span>Classify: <strong>${classify}</strong></span>` : ''}
    </div>
</div>

<div class="report-body">

    <div class="summary-grid">
        <div class="summary-box">
            <div class="summary-label">Properties Owned</div>
            <div class="summary-value accent">${totalProperties}</div>
        </div>
        <div class="summary-box">
            <div class="summary-label">Total Acquired Value</div>
            <div class="summary-value accent">${totalValueFormatted}</div>
        </div>
        <div class="summary-box">
            <div class="summary-label">Accounts</div>
            <div class="summary-value">${getList(r.Accounts).length}</div>
        </div>
        <div class="summary-box">
            <div class="summary-label">Avg. Per Property</div>
            <div class="summary-value">${totalProperties > 0 ? '$' + Math.round(totalValue / totalProperties).toLocaleString() : '—'}</div>
        </div>
    </div>

    <div class="section-title">Real Estate Holdings</div>
    ${hasProps ? `
    <table class="sreo-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Property / Address</th>
                <th>Type</th>
                <th>Size</th>
                <th>Purchase Date</th>
                <th>Purchase Price</th>
                <th>Tenants</th>
            </tr>
        </thead>
        <tbody>
            ${propRows}
            <tr class="totals-row">
                <td colspan="5" style="text-align:right;text-transform:uppercase;letter-spacing:0.5px;font-size:10px;">Portfolio Total</td>
                <td style="text-align:right;">${totalValueFormatted}</td>
                <td></td>
            </tr>
        </tbody>
    </table>
    ` : `<div class="empty-msg">No properties currently linked to this owner.</div>`}

    <div class="section-title" style="margin-top: 22px;">Associated Accounts</div>
    <ul class="accounts-list">${accountsHTML}</ul>

</div>

<div class="report-footer">
    <div>Schedule of Real Estate Owned — Confidential</div>
    <div>Generated ${reportDate}</div>
</div>

</body>
</html>`;
            }

            // =====================================================
            //  PHONE MANAGER — Full Integration
            // =====================================================

            const pmSanitize = (str) => (str && typeof str === 'string') ? str.replace(/\D/g, '') : '';

            const pmFormatPhone = (str) => {
                if (!str) return '';
                const c = pmSanitize(str);
                const m = c.match(/^(\d{3})(\d{3})(\d{4})$/);
                return m ? `(${m[1]}) ${m[2]}-${m[3]}` : str;
            };

            const pmFormatInput = (e) => {
                const input = e.target;
                let v = input.value.replace(/\D/g, '').slice(0, 10);
                if (v.length > 6)      input.value = `(${v.slice(0,3)}) ${v.slice(3,6)}-${v.slice(6)}`;
                else if (v.length > 3) input.value = `(${v.slice(0,3)}) ${v.slice(3)}`;
                else if (v.length > 0) input.value = `(${v}`;
            };

            const pmColLabel = (col) => col === 'Phone' ? 'Ph1' : col.replace('Phone_', 'Ph');

            const pmParseWrongPhoneString = (str) => {
                if (!str) return [];
                return str.split(';').map(s => s.trim()).filter(s => s).map(item => {
                    const i = item.lastIndexOf(' (');
                    if (i !== -1 && item.endsWith(')')) {
                        return { number: item.substring(0, i).trim(), note: item.substring(i + 2, item.length - 1).trim() };
                    }
                    return { number: item, note: '' };
                });
            };

            async function pmUpdateRecord(updates) {
                if (!currentRecord) return;
                try {
                    await grist.docApi.applyUserActions([['UpdateRecord', CONFIG.tableId, currentRecord.id, updates]]);
                } catch (err) {
                    console.error("Grist Update Error:", err);
                    pmShowToast("Failed to save changes", "error", 4000);
                }
            }

            // ── PM Modal ──
            function pmShowModal({ title, description, placeholder = '', defaultValue = '', confirmText = 'Confirm', cancelText = 'Cancel', onConfirm, onCancel, showInput = true }) {
                const modalOverlay = $('pm-modal-overlay');
                const modalTitle = $('pm-modal-title');
                const modalDesc = $('pm-modal-desc');
                const modalInput = $('pm-modal-input');
                const modalActions = $('pm-modal-actions');

                modalTitle.textContent = title;
                modalDesc.textContent = description || '';

                if (showInput) {
                    modalInput.classList.remove('hidden');
                    modalInput.value = defaultValue;
                    modalInput.placeholder = placeholder;
                } else {
                    modalInput.classList.add('hidden');
                }

                modalActions.innerHTML = '';

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'pm-btn-sm secondary';
                cancelBtn.textContent = cancelText;
                cancelBtn.onclick = () => { pmCloseModal(); if (onCancel) onCancel(); };

                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'pm-btn-sm primary';
                confirmBtn.textContent = confirmText;
                confirmBtn.onclick = () => {
                    const value = showInput ? modalInput.value : true;
                    pmCloseModal();
                    if (onConfirm) onConfirm(value);
                };

                modalActions.appendChild(cancelBtn);
                modalActions.appendChild(confirmBtn);
                modalOverlay.classList.add('active');

                requestAnimationFrame(() => {
                    if (showInput) modalInput.focus();
                    else confirmBtn.focus();
                });

                modalInput.onkeydown = (e) => {
                    if (e.key === 'Enter')  confirmBtn.click();
                    if (e.key === 'Escape') cancelBtn.click();
                };
                modalOverlay.onkeydown = (e) => {
                    if (e.key === 'Escape') cancelBtn.click();
                };
            }

            function pmCloseModal() {
                const modalOverlay = $('pm-modal-overlay');
                const modalInput = $('pm-modal-input');
                modalOverlay.classList.remove('active');
                modalInput.onkeydown = null;
                modalOverlay.onkeydown = null;
            }

            $('pm-modal-overlay').addEventListener('mousedown', (e) => {
                if (e.target === $('pm-modal-overlay')) pmCloseModal();
            });

            // ── PM Toasts ──
            function pmShowToast(message, type = 'info', duration = 3000) {
                const toast = document.createElement('div');
                toast.className = `pm-toast ${type}`;
                const icons = {
                    success: '<svg width="13" height="13" fill="none" stroke="#059669" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>',
                    error:   '<svg width="13" height="13" fill="none" stroke="#dc2626" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>',
                    warning: '<svg width="13" height="13" fill="none" stroke="#b45309" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
                    info:    '<svg width="13" height="13" fill="none" stroke="#2563eb" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
                };
                toast.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
                $('pm-toast-container').appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('exiting');
                    setTimeout(() => toast.remove(), 220);
                }, duration);
            }

            // ── PM Render ──
            function pmRender() {
                const mainList = $('pm-main-list');
                if (!currentRecord) {
                    mainList.innerHTML = '<div class="pm-empty-msg">Select a record to view numbers</div>';
                    return;
                }

                let savedCount = 0;
                let savedRows = '';

                CONFIG.phoneColumns.forEach(col => {
                    const val = currentRecord[col];
                    if (val && String(val).trim()) {
                        savedCount++;
                        const note  = currentRecord[CONFIG.noteMap[col]] || '';
                        const clean = pmSanitize(val);
                        const fmt   = pmFormatPhone(val);
                        const noteHtml = note
                            ? `<span class="pm-row-note" title="${note}">${marked.parseInline(note)}</span>`
                            : '';

                        savedRows += `
                        <div class="pm-phone-row">
                            <span class="pm-row-label">${pmColLabel(col)}</span>
                            <a href="tel:${clean}" class="pm-row-number">${fmt}</a>
                            ${noteHtml}
                            <span style="flex:1;min-width:4px;"></span>
                            <div class="pm-row-divider"></div>
                            <div class="pm-row-actions">
                                <button class="pm-btn-icon" title="Webex" onclick="window.open('sip:${clean}')"><img src="https://img.icons8.com/fluent/512/webex.png" alt=""></button>
                                <button class="pm-btn-icon" title="Call" onclick="window.open('tel:${clean}')"><img src="https://static.wikia.nocookie.net/logopedia/images/b/b2/Microsoft_Phone_Link_%282022%29.svg" alt=""></button>
                                <button class="pm-btn-icon" title="SMS" onclick="window.open('sms:${clean}')"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/IMessage_logo.svg/1280px-IMessage_logo.svg.png" alt=""></button>
                                <div class="pm-row-divider"></div>
                                <button class="pm-row-btn mark-wrong" data-field="${col}">Wrong</button>
                            </div>
                        </div>`;
                    }
                });

                const wrongList = pmParseWrongPhoneString(currentRecord[CONFIG.wrongCol]);
                let wrongRows = '';

                wrongList.forEach((w, i) => {
                    const noteHtml = w.note
                        ? `<span class="pm-row-note" title="${w.note}">${marked.parseInline(w.note)}</span>`
                        : '';

                    wrongRows += `
                    <div class="pm-phone-row wrong">
                        <span class="pm-row-label">Bad</span>
                        <span class="pm-row-number">${pmFormatPhone(w.number)}</span>
                        ${noteHtml}
                        <span style="flex:1;min-width:4px;"></span>
                        <div class="pm-row-divider"></div>
                        <span class="pm-row-tag">Wrong</span>
                        <button class="pm-row-btn restore" data-index="${i}">Restore</button>
                    </div>`;
                });

                mainList.innerHTML = `
                    <div class="pm-section">
                        <div class="pm-section-head">
                            <span class="pm-section-title">Active Numbers</span>
                            <span class="pm-section-badge">${savedCount}</span>
                        </div>
                        ${savedRows || '<div class="pm-empty-msg">No active numbers</div>'}
                    </div>
                    <div class="pm-section">
                        <div class="pm-section-head">
                            <span class="pm-section-title">Do Not Call</span>
                            ${wrongList.length ? `<span class="pm-section-badge danger">${wrongList.length}</span>` : ''}
                        </div>
                        ${wrongRows || '<div class="pm-empty-msg">None marked as wrong</div>'}
                    </div>`;

                pmAttachListeners();
            }

            function pmAttachListeners() {
                document.querySelectorAll('.mark-wrong').forEach(btn => {
                    btn.onclick = () => {
                        const field = btn.dataset.field;
                        const number = currentRecord[field];
                        const noteField = CONFIG.noteMap[field];
                        const existingNote = currentRecord[noteField] || '';

                        pmShowModal({
                            title: 'Mark as Wrong',
                            description: `Remove ${pmFormatPhone(number)} from active numbers.`,
                            placeholder: 'Reason (optional)',
                            defaultValue: existingNote,
                            confirmText: 'Mark Wrong',
                            cancelText: 'Cancel',
                            onConfirm: async (reason) => {
                                const entry = `${pmFormatPhone(number)}${reason ? ` (${reason})` : ''}; `;
                                const currentWrong = currentRecord[CONFIG.wrongCol] || '';
                                const updates = {
                                    [field]: null,
                                    [noteField]: null,
                                    [CONFIG.wrongCol]: currentWrong + entry
                                };
                                await pmUpdateRecord(updates);
                                currentRecord[field] = null;
                                currentRecord[noteField] = null;
                                currentRecord[CONFIG.wrongCol] = (currentRecord[CONFIG.wrongCol] || '') + entry;
                                pmRender();
                                pmShowToast(`${pmFormatPhone(number)} marked wrong`, 'warning');
                            }
                        });
                    };
                });

                document.querySelectorAll('.restore').forEach(btn => {
                    btn.onclick = () => {
                        const idx = parseInt(btn.dataset.index, 10);
                        const list = pmParseWrongPhoneString(currentRecord[CONFIG.wrongCol]);
                        const entry = list[idx];
                        if (!entry) return;

                        pmShowModal({
                            title: 'Restore Number',
                            description: `Remove ${pmFormatPhone(entry.number)} from Do Not Call?`,
                            showInput: false,
                            confirmText: 'Restore',
                            cancelText: 'Cancel',
                            onConfirm: async () => {
                                const remaining = list.filter((_, i) => i !== idx);
                                const newVal = remaining.map(w => `${w.number}${w.note ? ` (${w.note})` : ''}`).join('; ') + (remaining.length ? ';' : '');
                                await pmUpdateRecord({ [CONFIG.wrongCol]: newVal });
                                currentRecord[CONFIG.wrongCol] = newVal;
                                pmRender();
                                pmShowToast(`${pmFormatPhone(entry.number)} restored`, 'success');
                            }
                        });
                    };
                });
            }

            // ── PM Quick Dial ──
            function pmHandleDial(type) {
                const input = $('pm-input-phone');
                const digits = pmSanitize(input.value);
                if (digits.length < 10) { pmShowToast('Enter a 10-digit number first', 'error'); return; }
                window.open(type === 'webex' ? `sip:${digits}` : type === 'sms' ? `sms:${digits}` : `tel:${digits}`, '_blank');
            }

            $('pm-btn-webex').addEventListener('click', () => pmHandleDial('webex'));
            $('pm-btn-tel').addEventListener('click', () => pmHandleDial('tel'));
            $('pm-btn-sms').addEventListener('click', () => pmHandleDial('sms'));
            $('pm-input-phone').addEventListener('input', pmFormatInput);
            $('pm-input-phone').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pm-btn-check').click(); });

            // ── PM Check ──
            $('pm-btn-check').addEventListener('click', () => {
                const input = $('pm-input-phone');
                const checkResult = $('pm-check-result');
                const digits = pmSanitize(input.value);

                if (!currentRecord) { pmShowToast('Select a record first', 'error'); return; }
                if (digits.length < 10) {
                    checkResult.innerHTML = '<div style="color:#dc2626;font-weight:600;font-size:12px;">Enter a valid 10-digit number.</div>';
                    checkResult.classList.add('active');
                    return;
                }

                const existing = [];
                CONFIG.phoneColumns.forEach(col => {
                    if (pmSanitize(currentRecord[col]) === digits) existing.push(pmColLabel(col));
                });
                pmParseWrongPhoneString(currentRecord[CONFIG.wrongCol]).forEach(w => {
                    if (pmSanitize(w.number) === digits) existing.push('Do Not Call');
                });

                if (existing.length > 0) {
                    checkResult.innerHTML = `
                        <div class="pm-result-header" style="color:#dc2626;">
                            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            Duplicate
                        </div>
                        <div style="font-size:11px;color:var(--text-secondary);">Found in: ${existing.join(', ')}</div>`;
                    checkResult.classList.add('active');
                    return;
                }

                const firstEmpty = CONFIG.phoneColumns.find(col => !currentRecord[col]);

                let html = `
                    <div class="pm-result-header" style="color:#059669;">
                        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        New Number
                    </div>
                    <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;"><strong>${pmFormatPhone(digits)}</strong> not on file.</div>
                    <div class="pm-result-actions">`;

                if (firstEmpty) {
                    html += `<button class="pm-btn-sm primary" id="pm-btn-add-saved">Add to ${pmColLabel(firstEmpty)}</button>`;
                } else {
                    html += `<span style="font-size:10px;color:var(--text-muted);line-height:28px;">All slots full</span>`;
                }

                html += `<button class="pm-btn-sm secondary" id="pm-btn-add-wrong">Mark Wrong</button></div>`;

                checkResult.innerHTML = html;
                checkResult.classList.add('active');

                const addBtn = $('pm-btn-add-saved');
                if (addBtn) {
                    addBtn.onclick = () => {
                        pmShowModal({
                            title: 'Add Number',
                            description: `Add ${pmFormatPhone(digits)} to ${pmColLabel(firstEmpty)}.`,
                            placeholder: 'Note (optional)',
                            confirmText: 'Add',
                            cancelText: 'Cancel',
                            onConfirm: async (note) => {
                                const updates = { [firstEmpty]: pmFormatPhone(digits) };
                                if (note) updates[CONFIG.noteMap[firstEmpty]] = note;
                                await pmUpdateRecord(updates);
                                currentRecord[firstEmpty] = pmFormatPhone(digits);
                                if (note) currentRecord[CONFIG.noteMap[firstEmpty]] = note;
                                checkResult.classList.remove('active');
                                input.value = '';
                                pmRender();
                                pmShowToast(`${pmFormatPhone(digits)} added`, 'success');
                            }
                        });
                    };
                }

                $('pm-btn-add-wrong').onclick = () => {
                    pmShowModal({
                        title: 'Mark as Wrong',
                        description: `Add ${pmFormatPhone(digits)} to Do Not Call.`,
                        placeholder: 'Reason (optional)',
                        confirmText: 'Mark Wrong',
                        cancelText: 'Cancel',
                        onConfirm: async (reason) => {
                            const entry = `${pmFormatPhone(digits)}${reason ? ` (${reason})` : ''}; `;
                            const newVal = (currentRecord[CONFIG.wrongCol] || '') + entry;
                            await pmUpdateRecord({ [CONFIG.wrongCol]: newVal });
                            currentRecord[CONFIG.wrongCol] = newVal;
                            checkResult.classList.remove('active');
                            input.value = '';
                            pmRender();
                            pmShowToast(`${pmFormatPhone(digits)} marked wrong`, 'warning');
                        }
                    });
                };
            });

            // ── GRIST INIT ──
            if (typeof grist !== 'undefined') {
                grist.ready({ requiredAccess: 'full' });
                grist.onRecord(record => renderOwner(record));
            } else {
                console.warn('Grist API not available — running in standalone mode.');
                document.getElementById('noData').classList.remove('hidden');
                document.getElementById('activeView').classList.add('hidden');
            }

        });
    </script>
</body>
</html>
