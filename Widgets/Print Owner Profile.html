<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Owner Portfolio View</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
        <style>
            :root {
                --primary: #2563eb;
                --primary-light: #dbeafe;
                --text-main: #1f2937;
                --text-muted: #6b7280;
                --bg-body: #f3f4f6;
                --bg-card: #ffffff;
                --border: #e5e7eb;
                --radius: 10px;
                --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: 'Inter', sans-serif;
                background-color: var(--bg-body);
                color: var(--text-main);
                font-size: 14px;
                height: 100vh;
                overflow: hidden;
            }

            body.pdf-generating {
                overflow: visible !important;
                height: auto !important;
                background: white;
            }
            body.pdf-generating .app-shell {
                height: auto !important;
                min-height: 100vh;
                box-shadow: none;
            }
            body.pdf-generating .content-area {
                overflow: visible !important;
                padding-bottom: 50px;
            }

            .app-shell {
                display: flex;
                flex-direction: column;
                height: 100%;
                background: var(--bg-card);
            }

            /* --- Header --- */
            .header {
                background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
                color: white;
                padding: 20px;
                display: flex;
                gap: 16px;
                align-items: center;
                flex-shrink: 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }

            .profile-img-container {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                background: rgba(255,255,255,0.1);
                border: 3px solid rgba(255,255,255,0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                flex-shrink: 0;
                font-size: 32px;
                color: white;
            }

            .profile-img { width: 100%; height: 100%; object-fit: cover; }

            .header-info { flex: 1; min-width: 0; }
            .owner-name { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .owner-sub { font-size: 14px; opacity: 0.8; margin-top: 4px; font-weight: 500; }

            .header-actions { display: flex; gap: 10px; }
            .btn-action {
                background: rgba(255,255,255,0.1);
                border: 1px solid rgba(255,255,255,0.2);
                color: white;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 6px;
                transition: all 0.2s;
            }
            .btn-action:hover { background: rgba(255,255,255,0.2); }
            .btn-action:disabled { opacity: 0.5; cursor: default; }

            /* --- Content Scroll --- */
            .content-area {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
                background: var(--bg-body);
            }

            /* --- Sections --- */
            .section {
                background: white;
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 16px;
                margin-bottom: 20px;
                border: 1px solid var(--border);
                break-inside: avoid; 
                page-break-inside: avoid;
            }

            .section-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
            }
            .section-title {
                font-size: 14px;
                font-weight: 700;
                color: var(--text-main);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .section-badge {
                background: var(--primary-light);
                color: var(--primary);
                padding: 2px 8px;
                border-radius: 12px;
                font-size: 11px;
                font-weight: 600;
            }

            /* --- Badges & Tags --- */
            .badges-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
            .tag {
                padding: 4px 10px;
                border-radius: 4px;
                font-size: 11px;
                font-weight: 600;
                background: #f3f4f6;
                color: #374151;
                border: 1px solid #e5e7eb;
                display: inline-block;
                white-space: nowrap;
            }
            .tag-success { background: #ecfdf5 !important; color: #065f46 !important; border-color: #a7f3d0 !important; }
            .tag-danger { background: #fef2f2 !important; color: #991b1b !important; border-color: #fecaca !important; }
            .tag-info { background: #eff6ff !important; color: #1e40af !important; border-color: #bfdbfe !important; }

            /* --- Stats Grid --- */
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 12px;
            }
            .stat-box {
                background: #f9fafb;
                padding: 12px;
                border-radius: 6px;
                border-left: 3px solid var(--primary);
            }
            .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
            .stat-value { font-size: 16px; font-weight: 700; color: var(--text-main); margin-top: 2px; }

            /* --- Activity Timeline --- */
            .timeline {
                position: relative;
                padding-left: 20px;
            }
            .timeline::before {
                content: '';
                position: absolute;
                left: 6px;
                top: 4px;
                bottom: 4px;
                width: 2px;
                background: #e5e7eb;
            }
            .timeline-item {
                position: relative;
                margin-bottom: 16px;
            }
            .timeline-dot {
                position: absolute;
                left: -17px;
                top: 4px;
                width: 10px;
                height: 10px;
                background: white;
                border: 2px solid var(--primary);
                border-radius: 50%;
            }
            .time-date { font-size: 11px; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
            .time-text { font-size: 13px; color: var(--text-main); white-space: pre-wrap; }

            /* --- Property Cards --- */
            .property-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 16px;
            }

            .property-card {
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                overflow: hidden;
                background: white;
                display: flex;
                flex-direction: column;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .prop-img-container {
                height: 160px;
                background: #f3f4f6;
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .prop-img { width: 100%; height: 100%; object-fit: cover; }
            
            .prop-no-img {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #9ca3af;
                font-size: 24px;
                flex-direction: column;
                text-align: center;
                padding: 10px;
                background: #f3f4f6;
            }
            .prop-no-img span { font-size: 10px; margin-top: 5px; color: #6b7280; }
            .prop-no-img a { 
                font-size: 9px; 
                margin-top: 8px; 
                color: var(--primary); 
                text-decoration: none;
                max-width: 90%;
                word-break: break-all;
            }
            .prop-no-img a:hover { text-decoration: underline; }

            .prop-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
            .prop-address { font-size: 15px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
            .prop-tags { margin-bottom: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
            .prop-details {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-top: auto;
                padding-top: 8px;
                border-top: 1px solid #f3f4f6;
            }
            .prop-price { font-size: 14px; font-weight: 700; color: var(--primary); }
            .prop-date { font-size: 11px; color: var(--text-muted); }

            .empty-state {
                text-align: center;
                color: var(--text-muted);
                padding: 40px 20px;
                background: #f9fafb;
                border-radius: 8px;
                border: 1px dashed #d1d5db;
            }

            .loading-overlay {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(255,255,255, 0.95);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--primary);
                font-size: 18px;
                z-index: 99999;
                flex-direction: column;
                gap: 15px;
            }
            .spinner {
                border: 4px solid #f3f3f3;
                border-top: 4px solid var(--primary);
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

            .hidden { display: none !important; }
        </style>
    </head>
    <body>

        <div class="app-shell">
            <!-- Header -->
            <div class="header">
                <div class="profile-img-container" id="profileContainer">
                    <div id="profileInitial">?</div>
                </div>
                <div class="header-info">
                    <div class="owner-name" id="ownerName">Select an Owner</div>
                    <div class="owner-sub" id="ownerSub">Choose a row to view portfolio</div>
                </div>
                <div class="header-actions">
                    <button id="btnExport" class="btn-action">💾 Export PDF</button>
                </div>
            </div>

            <!-- Content -->
            <div class="content-area" id="mainContent">
                <div id="noData" class="empty-state">
                    <div style="font-size:32px; margin-bottom:8px;">📋</div>
                    <div style="font-weight:600;">No Owner Selected</div>
                </div>

                <div id="activeView" class="hidden">
                    <div class="section">
                        <div class="badges-wrap" id="badgesContainer" style="margin-bottom:12px;"></div>
                        <div class="stats-grid" id="statsGrid"></div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">🏘️ Property Portfolio</div>
                            <div class="section-badge" id="propCount">0 Properties</div>
                        </div>
                        <div id="propertiesContainer">
                            <div class="property-grid" id="propertyGrid"></div>
                            <div id="noPropsMsg" class="hidden empty-state">No properties linked to this owner.</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">📝 Activity & Notes</div>
                        </div>
                        <div id="activityContent"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <div>Generating PDF...</div>
            <div style="font-size:12px; color:#666; max-width: 300px; text-align: center;">Please wait. Note: Some images may not render due to server security restrictions.</div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {

                const CONFIG = {
                    tableId: 'Owners_',
                    propTable: 'Properties_'
                };

                const $ = id => document.getElementById(id);
                const isEmpty = v => v === null || v === undefined || (typeof v==='string' && v.trim()==='') || (Array.isArray(v) && v.length===0);

                const formatMoney = (num) => {
                    if(!num || isNaN(num)) return 'N/A';
                    return '$' + Number(num).toLocaleString();
                };

                const formatDate = (d) => {
                    if(!d) return '';
                    try {
                        const date = typeof d === 'number' ? new Date(d * 1000) : new Date(d);
                        return date.toLocaleDateString('en-US', { month:'short', year:'numeric' });
                    } catch(e) { return ''; }
                };

                const getList = (val) => {
                    if (isEmpty(val)) return [];
                    if (Array.isArray(val) && val[0] === 'L') return val.slice(1);
                    if (Array.isArray(val)) return val;
                    if (typeof val === 'string') return [val];
                    return [];
                };

                const firstItem = (v) => {
                    const list = getList(v);
                    return list.length > 0 ? list[0] : '';
                };

                function columnarToRows(data) {
                    if (!data || !data.id) return [];
                    return data.id.map((id, index) => {
                        const fields = {};
                        Object.keys(data).forEach(key => {
                            if (key !== 'id') fields[key] = data[key][index];
                        });
                        return { id, fields };
                    });
                }

                let currentRecord = null;
                let ownerProperties = [];

                const DOM = {
                    profileContainer: $('profileContainer'),
                    ownerName: $('ownerName'),
                    ownerSub: $('ownerSub'),
                    noData: $('noData'),
                    activeView: $('activeView'),
                    badges: $('badgesContainer'),
                    stats: $('statsGrid'),
                    propertyGrid: $('propertyGrid'),
                    propCount: $('propCount'),
                    noPropsMsg: $('noPropsMsg'),
                    activityContent: $('activityContent'),
                    btnExport: $('btnExport'),
                    loadingOverlay: $('loadingOverlay')
                };

                function renderOwner(record) {
                    currentRecord = record;
                    if(!record) {
                        DOM.noData.classList.remove('hidden');
                        DOM.activeView.classList.add('hidden');
                        return;
                    }

                    DOM.noData.classList.add('hidden');
                    DOM.activeView.classList.remove('hidden');

                    const name = record.Name || record.Owner_Full_Name || 'Unknown';
                    DOM.ownerName.textContent = name;
                    DOM.ownerSub.textContent = [firstItem(record.Accounts), record.Title].filter(Boolean).join(' • ');

                    if(record.Profile_Image) {
                        DOM.profileContainer.innerHTML = `<img src="${record.Profile_Image}" class="profile-img" onerror="this.parentNode.innerHTML='<div id=profileInitial>${name.charAt(0)}</div>'">`;
                    } else {
                        DOM.profileContainer.innerHTML = `<div id="profileInitial">${name.charAt(0)}</div>`;
                    }

                    renderBadges();
                    renderStats();
                    renderActivity();
                    renderProperties();
                }

                function renderBadges() {
                    let html = '';
                    const fields = ['Segment', 'Classify', 'Owner_Personality', 'Opportunity'];
                    
                    fields.forEach(f => {
                        const items = getList(currentRecord[f]);
                        items.forEach(val => {
                            let cls = 'tag';
                            if(/DNC|NOT INTERESTED|ANGRY|RUDE/i.test(val)) cls = 'tag-danger';
                            else if(/FRIENDLY|TALKATIVE|CALL AGAIN/i.test(val)) cls = 'tag-success';
                            else if(/BROKER|TIER/i.test(val)) cls = 'tag-info';
                            html += `<span class="${cls}">${val}</span>`;
                        });
                    });
                    DOM.badges.innerHTML = html;
                }

                function renderStats() {
                    let html = '';
                    const addStat = (label, val) => {
                        if(!isEmpty(val)) html += `<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-value">${val}</div></div>`;
                    };
                    
                    addStat('Age', currentRecord.Age);
                    addStat('Relationship', firstItem(currentRecord.Call_Relationship));
                    addStat('Last Segment', currentRecord.Last_Call_Segment);
                    addStat('Tranche', firstItem(currentRecord.Tranche));
                    
                    DOM.stats.innerHTML = html || '<div style="color:var(--text-muted);">No stats available.</div>';
                }

                function renderActivity() {
                    let html = '<div class="timeline">';
                    const notes = [
                        { d: currentRecord.Date, t: currentRecord.Last_Call_Segment, l: 'Last Call' },
                        { t: currentRecord.Contact_1, l: 'Contact 1' },
                        { t: currentRecord.Contact_2, l: 'Contact 2' },
                        { t: currentRecord.Contact_3, l: 'Contact 3' },
                        { t: currentRecord.Contact_4, l: 'Contact 4' }, 
                        { t: currentRecord.Extra_Notes, l: 'Extra Notes' }
                    ];

                    let hasContent = false;
                    notes.forEach(n => {
                        if(n.t) {
                            hasContent = true;
                            html += `
                                <div class="timeline-item">
                                    <div class="timeline-dot"></div>
                                    <div class="time-date">${n.l} ${n.d ? ' - ' + formatDate(n.d) : ''}</div>
                                    <div class="time-text">${n.t}</div>
                                </div>`;
                        }
                    });

                    html += '</div>';
                    DOM.activityContent.innerHTML = hasContent ? html : '<div style="color:var(--text-muted); text-align:center;">No activity recorded.</div>';
                }

                async function renderProperties() {
                    DOM.propertyGrid.innerHTML = '<div class="empty-state">Loading...</div>';
                    try {
                        const data = await grist.docApi.fetchTable(CONFIG.propTable);
                        const allProps = columnarToRows(data);
                        
                        ownerProperties = allProps.filter(p => {
                            const refs = getList(p.fields.Name);
                            return refs.includes(currentRecord.id);
                        });

                        DOM.propCount.textContent = `${ownerProperties.length} Properties`;

                        if(ownerProperties.length === 0) {
                            DOM.propertyGrid.innerHTML = '';
                            DOM.noPropsMsg.classList.remove('hidden');
                        } else {
                            DOM.propertyGrid.innerHTML = ownerProperties.map(p => {
                                const f = p.fields;
                                const imgUrl = f.Pop_up_IMG || null;
                                
                                // IMPROVED: Shows clickable URL when image fails to load
                                const imgHtml = imgUrl 
                                    ? `<img src="${imgUrl}" class="prop-img" onerror="this.parentElement.innerHTML='<div class=prop-no-img><span>️</span><span>Image Blocked by Server</span><a href=&quot;${imgUrl}&quot; target=&quot;_blank&quot;>🔗 View Image</a></div>'">` 
                                    : `<div class="prop-no-img"><span>📷</span><span>No Image URL</span></div>`;
                                
                                const types = getList(f.Secondary_Type);
                                const typeStr = [f.Property_Type, ...types].filter(Boolean).join(' / ') || 'N/A';
                                const price = formatMoney(f.Last_Sale_Price);
                                const date = formatDate(f.Last_Sale_Date);

                                return `
                                    <div class="property-card">
                                        <div class="prop-img-container">${imgHtml}</div>
                                        <div class="prop-body">
                                            <div class="prop-address">${f.Property_Address || 'No Address'}</div>
                                            <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">${f.City || ''}${f.City && f.State ? ', ' : ''}${f.State || ''}</div>
                                            <div class="prop-tags"><span class="tag tag-info">${typeStr}</span></div>
                                            <div class="prop-details">
                                                <div>
                                                    <div class="prop-price">${price}</div>
                                                    <div class="prop-date">Last Sale: ${date || 'N/A'}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>`;
                            }).join('');
                        }
                    } catch(e) {
                        console.error(e);
                        DOM.propertyGrid.innerHTML = '<div class="empty-state" style="color:red;">Error loading properties.</div>';
                    }
                }

                DOM.btnExport.addEventListener('click', async () => {
                    if(!currentRecord) return;
                    
                    DOM.loadingOverlay.classList.remove('hidden');
                    DOM.btnExport.classList.add('hidden');

                    document.body.classList.add('pdf-generating');
                    
                    // Wait for images to attempt loading
                    await new Promise(r => setTimeout(r, 1500));

                    const element = document.querySelector('.app-shell');
                    const fullHeight = element.scrollHeight;

                    const opt = {
                        margin:       0.5,
                        filename:     `${currentRecord.Name || 'Owner'}_Portfolio.pdf`,
                        image:        { type: 'jpeg', quality: 0.95 },
                        html2canvas:  { 
                            scale: 2, 
                            useCORS: true, 
                            allowTaint: true, 
                            logging: false,
                            scrollY: 0,
                            windowWidth: element.offsetWidth,
                            windowHeight: fullHeight 
                        },
                        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' },
                        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
                    };

                    try {
                        await html2pdf().set(opt).from(element).save();
                    } catch(e) {
                        console.error("PDF Generation Error", e);
                        alert("Could not generate PDF. Check console for details.");
                    } finally {
                        document.body.classList.remove('pdf-generating');
                        DOM.btnExport.classList.remove('hidden');
                        DOM.loadingOverlay.classList.add('hidden');
                    }
                });

                grist.ready({ requiredAccess: 'full' });
                grist.onRecord(record => renderOwner(record));

            });
        </script>
    </body>
</html>
