<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grist Schema & ACL Reporter</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      --primary-color: #16b378;
      --text-color: #333;
      --border-color: #ddd;
      --bg-color: #f9f9f9;
      --ai-bg: #2b303b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 15px;
      color: var(--text-color);
      background-color: white;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    .description { font-size: 0.9rem; color: #666; margin-bottom: 15px; }
    
    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background-color: white;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    button:hover { background-color: var(--bg-color); }
    button.active {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
    button.action-btn {
      background-color: transparent;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      font-weight: bold;
    }
    button.action-btn:hover { background-color: #eef9f4; }
    
    .separator {
      width: 1px;
      height: 20px;
      background-color: var(--border-color);
      margin: 0 5px;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background-color: var(--bg-color);
      font-weight: 600;
    }
    pre {
      background-color: #f4f4f4;
      padding: 6px;
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 12px;
      border-radius: 3px;
    }
    
    /* Code View Styles */
    .code-view-container {
      background-color: #282c34;
      color: #abb2bf;
      padding: 15px;
      border-radius: 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 13px;
      white-space: pre;
      overflow-x: auto;
    }
    .code-keyword { color: #c678dd; }
    .code-func { color: #61afef; }
    .code-string { color: #98c379; }
    .code-comment { color: #5c6370; font-style: italic; }

    /* AI Mode Styles */
    .ai-container {
      background-color: var(--ai-bg);
      color: #c0c5ce;
      padding: 20px;
      border-radius: 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
      border: 2px solid var(--primary-color);
    }

    /* Notifications */
    #notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }
    #notification.show { opacity: 1; }
  </style>
</head>
<body>

  <h1>Grist Document Reporter</h1>
  <p class="description">
    Generate reports on Table Schemas and Access Control Lists (ACLs). 
    Use <b>AI Mode</b> to format output for ChatGPT or Claude.
    <br><span style="color:#b45309; font-weight:bold;">Requires Full Access.</span>
  </p>

  <!-- Navigation -->
  <div class="controls">
    <button id="btn-tables">Tables</button>
    <button id="btn-acl">ACLs</button>
    <span class="separator"></span>
    <button id="btn-code-view">Code View</button>
    <button id="btn-ai-mode">AI Mode</button>
  </div>

  <!-- Action Buttons -->
  <div class="controls" style="margin-bottom: 20px;">
    <button id="btn-copy" class="action-btn">📋 Copy to Clipboard</button>
    <button id="btn-csv" class="action-btn">📊 Download CSV</button>
    <button id="btn-html" class="action-btn">💾 Download HTML</button>
  </div>

  <!-- Output Container -->
  <div id="loading" style="display:none; font-style:italic; color:#888;">Loading data...</div>
  <div id="output-container">
    <div style="padding: 20px; text-align:center; color:#888;">
      Click <b>Tables</b> or <b>ACLs</b> to generate a report.
    </div>
  </div>
  
  <!-- Notification Element -->
  <div id="notification">Copied!</div>

<script>
let currentMode = null; // Start as null so we don't auto-load
let codeViewEnabled = false;
let aiModeEnabled = false;
let currentData = null; 

// Utility: DOM Shortcuts
const $ = id => document.getElementById(id);

function ready(fn) {
  if (document.readyState !== 'loading') fn();
  else document.addEventListener('DOMContentLoaded', fn);
}

ready(function() {
  // Button Listeners
  $('btn-tables').onclick = () => switchMode('tables');
  $('btn-acl').onclick = () => switchMode('acl');
  $('btn-code-view').onclick = toggleCodeView;
  $('btn-ai-mode').onclick = toggleAIMode;
  
  // Export Listeners
  $('btn-copy').onclick = copyToClipboard;
  $('btn-csv').onclick = downloadCSV;
  $('btn-html').onclick = downloadHTML;

  // Init Grist
  // IMPORTANT: 'full' access is required to read _grist_Tables
  grist.ready({ requiredAccess: 'full' });
  
  // We do NOT call refreshView() here. 
  // We wait for the user to click a button.
});

function switchMode(mode) {
  currentMode = mode;
  
  // Update button active states
  $('btn-tables').classList.toggle('active', mode === 'tables');
  $('btn-acl').classList.toggle('active', mode === 'acl');
  
  // Trigger the data fetch
  refreshView();
}

function toggleCodeView() {
  codeViewEnabled = !codeViewEnabled;
  $('btn-code-view').classList.toggle('active', codeViewEnabled);
  if (codeViewEnabled && aiModeEnabled) toggleAIMode(); // Turn off AI mode if Code View is on
  if (currentMode) refreshView(); // Only refresh if data is already loaded
}

function toggleAIMode() {
  aiModeEnabled = !aiModeEnabled;
  $('btn-ai-mode').classList.toggle('active', aiModeEnabled);
  if (aiModeEnabled && codeViewEnabled) toggleCodeView(); // Turn off Code View if AI mode is on
  if (currentMode) refreshView(); // Only refresh if data is already loaded
}

async function refreshView() {
  if (!currentMode) return; // Safety check

  $('output-container').innerHTML = '';
  $('loading').style.display = 'block';
  
  try {
    if (currentMode === 'tables') {
      await showSchemaTables();
    } else {
      await showACL();
    }
  } catch (e) {
    let errorMsg = e.message;
    if (e.message && e.message.includes("No view")) {
        errorMsg = "Waiting for access... Please click 'Grant Full Access' in the banner above or in widget settings.";
    } else if (e.message.includes("permission")) {
        errorMsg = "Permission denied. This widget requires 'Full Access' to read the schema.";
    }
    $('output-container').innerHTML = `<div style="color:red; padding: 10px; border: 1px solid red; background: #fff0f0;">Error: ${errorMsg}</div>`;
    console.error(e);
  }
  
  $('loading').style.display = 'none';
}

/* ---------------------------------------------------------------------
   1. TABLES / SCHEMA LOGIC
--------------------------------------------------------------------- */
async function showSchemaTables() {
  const tablesData = await grist.docApi.fetchTable("_grist_Tables");
  const colsData = await grist.docApi.fetchTable("_grist_Tables_column");

  let result = [];

  const tableIdMap = {};
  tablesData.id.forEach((id, i) => tableIdMap[id] = tablesData.tableId[i]);

  for (let i = 0; i < colsData.id.length; i++) {
    const tableNum = colsData.parentId[i];
    const tableName = tableIdMap[tableNum];
    const fieldName = colsData.label[i];
    const fieldType = colsData.type[i];
    const isFormula = colsData.isFormula[i];
    const formula = colsData.formula[i] || "";
    const widgetOpts = colsData.widgetOptions[i] ? JSON.parse(colsData.widgetOptions[i]) : {};

    if (fieldType === "ManualSortPos" || fieldName.startsWith("gristHelper")) continue;

    result.push({
      tableName: tableName,
      fieldName: fieldName,
      type: fieldType,
      isFormula: isFormula,
      formula: formula,
      choices: widgetOpts.choices || [],
    });
  }

  result.sort((a, b) => (a.tableName + a.fieldName).localeCompare(b.tableName + b.fieldName));
  
  const grouped = {};
  result.forEach(row => {
    if (!grouped[row.tableName]) grouped[row.tableName] = [];
    grouped[row.tableName].push(row);
  });

  currentData = { type: 'schema', data: grouped };

  if (aiModeEnabled) {
    renderAIMode(grouped);
  } else if (codeViewEnabled) {
    renderCodeView(grouped);
  } else {
    renderTableHTML(grouped);
  }
}

function renderTableHTML(grouped) {
  let html = `Date: ${getTodayDate()}`;
  
  for (const [tableName, rows] of Object.entries(grouped)) {
    html += `<h2>${tableName}</h2>`;
    html += `<table>
      <thead><tr>
        <th>Field</th><th>Type</th><th>Formula / Trigger</th><th>Config</th>
      </tr></thead><tbody>`;
    
    rows.forEach(row => {
      const typeLabel = row.isFormula ? "Formula" : row.type;
      let formulaCell = "";
      if (row.formula) formulaCell = `<pre>${escapeHtml(row.formula)}</pre>`;
      let configCell = "";
      if (row.choices.length) configCell += `<b>Choices:</b> ${row.choices.join(", ")}`;

      html += `<tr>
        <td><b>${row.fieldName}</b></td>
        <td>${typeLabel}</td>
        <td>${formulaCell}</td>
        <td>${configCell}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  $('output-container').innerHTML = html;
}

function renderCodeView(grouped) {
  let code = `# Grist Schema Export\n# Date: ${getTodayDate()}\n\n`;
  
  for (const [tableName, rows] of Object.entries(grouped)) {
    code += `<span class="code-keyword">class</span> <span class="code-func">${tableName}</span>:\n`;
    
    rows.forEach(row => {
      if (row.isFormula) {
        const cleanFormula = escapeHtml(row.formula.replace(/\n/g, "\n    # "));
        code += `  <span class="code-comment"># Formula</span>\n`;
        code += `  <span class="code-keyword">def</span> <span class="code-func">${row.fieldName}</span>(self):\n`;
        code += `    <span class="code-keyword">return</span> <span class="code-string">${cleanFormula}</span>\n\n`;
      } else {
        let typeDef = row.type;
        if (row.choices.length) typeDef += ` [${row.choices.map(c=>`'${c}'`).join(', ')}]`;
        
        code += `  <span class="code-func">${row.fieldName}</span>: <span class="code-keyword">${typeDef}</span>\n`;
      }
    });
    code += `\n`;
  }
  $('output-container').innerHTML = `<div class="code-view-container">${code}</div>`;
}

/* ---------------------------------------------------------------------
   2. AI MODE RENDERING
--------------------------------------------------------------------- */
function renderAIMode(grouped) {
  let markdown = generateAIMarkdown(grouped);
  let visualHtml = `<div class="ai-container">${escapeHtml(markdown)}</div>`;
  $('output-container').innerHTML = visualHtml;
}

function generateAIMarkdown(grouped) {
  let text = `Here is the schema for the Grist data tables, followed by the code view of each table.\n\n`;
  
  for (const [tableName, rows] of Object.entries(grouped)) {
    text += `## Table: ${tableName}\n`;
    text += `| Field | Type | Formula |\n`;
    text += `|---|---|---|\n`;
    
    rows.forEach(r => {
      const type = r.isFormula ? "Formula" : r.type;
      const formula = r.formula.replace(/\n/g, " ").replace(/"/g, "'");
      text += `| ${r.fieldName} | ${type} | ${r.isFormula ? formula : ""} |\n`;
    });

    text += `\n### Code View\n`;
    text += "```python\n";
    text += `class ${tableName}:\n`;
    
    rows.forEach(r => {
      if (r.isFormula) {
        text += `    def ${r.fieldName}(self):\n`;
        text += `        return ${r.formula}\n`;
      } else {
        text += `    ${r.fieldName} = ${r.type}\n`;
      }
    });
    text += "```\n\n---\n\n";
  }
  return text;
}

/* ---------------------------------------------------------------------
   3. ACL LOGIC
--------------------------------------------------------------------- */
async function showACL() {
  const resources = await grist.docApi.fetchTable("_grist_ACLResources");
  const rules = await grist.docApi.fetchTable("_grist_ACLRules");
  
  const rulesList = mapToObjects(rules);
  const resourcesList = mapToObjects(resources);

  let results = [];

  rulesList.forEach(rule => {
    const res = resourcesList.find(r => r.id === rule.resource) || {};
    
    const entry = {
      table: res.tableId || 'Document',
      columns: (res.colIds || []).join(", "),
      condition: rule.aclFormula || "All others",
      permissions: rule.permissionsText || "",
      memo: rule.memo || "",
      isUserAttr: false,
      attrName: "",
      attrTable: "",
      attrCol: ""
    };

    if (rule.userAttributes) {
      try {
        const ua = JSON.parse(rule.userAttributes);
        entry.isUserAttr = true;
        entry.table = "User Attributes";
        entry.attrName = ua.name || "";
        entry.attrTable = ua.tableId || "";
        entry.attrCol = ua.lookupColId || "";
      } catch(e) {}
    }

    results.push(entry);
  });

  results.sort((a, b) => (a.table + a.columns).localeCompare(b.table + b.columns));

  currentData = { type: 'acl', data: results };
  
  if (aiModeEnabled) {
      renderACL_AI(results);
  } else {
      renderACL_HTML(results);
  }
}

function renderACL_HTML(results) {
  let html = `Date: ${getTodayDate()}`;
  
  html += `<h2>User Attributes</h2><table>
    <thead><tr><th>Name</th><th>Lookup Table</th><th>Lookup Column</th></tr></thead><tbody>`;
  
  results.filter(r => r.isUserAttr).forEach(r => {
    html += `<tr><td>${r.attrName}</td><td>${r.attrTable}</td><td>${r.attrCol}</td></tr>`;
  });
  html += `</tbody></table>`;

  html += `<h2>Permissions Rules</h2><table>
    <thead><tr><th>Table</th><th>Columns</th><th>Condition</th><th>Permissions</th><th>Memo</th></tr></thead><tbody>`;
  
  let lastTable = "";
  results.filter(r => !r.isUserAttr).forEach(r => {
    if (r.table !== lastTable && lastTable !== "") {
      html += `<tr style="background-color:#f2f2f2; height:5px;"><td colspan="5"></td></tr>`;
    }
    lastTable = r.table;
    
    const perms = colorizePerms(r.permissions);
    html += `<tr>
      <td><b>${r.table}</b></td>
      <td>${r.columns}</td>
      <td><pre>${escapeHtml(r.condition)}</pre></td>
      <td>${perms}</td>
      <td>${r.memo}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  $('output-container').innerHTML = html;
}

function renderACL_AI(results) {
    let text = `Here are the Access Control Rules for the Grist document.\n\n`;
    
    text += `## User Attributes\n`;
    results.filter(r => r.isUserAttr).forEach(r => {
        text += `- Attribute: **${r.attrName}** looks up **${r.attrCol}** in table **${r.attrTable}**\n`;
    });
    text += `\n`;

    text += `## Permissions Rules\n`;
    results.filter(r => !r.isUserAttr).forEach(r => {
        text += `### Table: ${r.table}\n`;
        text += `- **Columns**: ${r.columns || 'All'}\n`;
        text += `- **Condition**: ${r.condition}\n`;
        text += `- **Permissions**: ${r.permissions}\n`;
        if(r.memo) text += `- **Memo**: ${r.memo}\n`;
        text += `\n`;
    });

    currentData.aiText = text; 
    $('output-container').innerHTML = `<div class="ai-container">${escapeHtml(text)}</div>`;
}

/* ---------------------------------------------------------------------
   4. EXPORT UTILITIES
--------------------------------------------------------------------- */

function copyToClipboard() {
  if (!currentData) {
    notify("No data loaded yet.");
    return;
  }
  
  let textToCopy = "";

  if (aiModeEnabled) {
    if (currentData.type === 'schema') {
        textToCopy = generateAIMarkdown(currentData.data); 
    } else {
        textToCopy = currentData.aiText || "";
    }
  } else {
    if (currentData.type === 'schema') {
      textToCopy = "Table\tField\tType\tFormula\n";
      for (const [tbl, rows] of Object.entries(currentData.data)) {
        rows.forEach(r => {
          textToCopy += `${tbl}\t${r.fieldName}\t${r.type}\t${r.formula}\n`;
        });
      }
    } else if (currentData.type === 'acl') {
      textToCopy = "Table\tColumns\tCondition\tPermissions\tMemo\n";
      currentData.data.forEach(r => {
        if(!r.isUserAttr) textToCopy += `${r.table}\t${r.columns}\t${r.condition}\t${r.permissions}\t${r.memo}\n`;
      });
    }
  }

  navigator.clipboard.writeText(textToCopy).then(() => notify("Copied to Clipboard!"));
}

function downloadCSV() {
  if (!currentData || aiModeEnabled) {
    notify("Download as CSV not available in this view.");
    return;
  }
  let csv = "";
  const sep = ",";

  if (currentData.type === 'schema') {
    csv = "Table,Field,Type,Formula\n";
    for (const [tbl, rows] of Object.entries(currentData.data)) {
      rows.forEach(r => {
        csv += `${quoteCsv(tbl)}${sep}${quoteCsv(r.fieldName)}${sep}${quoteCsv(r.type)}${sep}${quoteCsv(r.formula)}\n`;
      });
    }
    downloadFile(csv, "schema_export.csv", "text/csv");
  } else {
    csv = "Table,Columns,Condition,Permissions,Memo\n";
    currentData.data.forEach(r => {
      if(!r.isUserAttr) {
        csv += `${quoteCsv(r.table)}${sep}${quoteCsv(r.columns)}${sep}${quoteCsv(r.condition)}${sep}${quoteCsv(r.permissions)}${sep}${quoteCsv(r.memo)}\n`;
      }
    });
    downloadFile(csv, "acl_export.csv", "text/csv");
  }
}

function downloadHTML() {
  if (aiModeEnabled) {
    let text = (currentData.type === 'schema') ? generateAIMarkdown(currentData.data) : currentData.aiText;
    downloadFile(text, "ai_prompt.txt", "text/plain");
    notify("Downloaded AI Prompt");
    return;
  }
  
  if (!currentData) return;

  const content = $('output-container').innerHTML;
  const styles = document.querySelector('style').outerHTML;
  const fullHtml = `<html><head>${styles}</head><body>${content}</body></html>`;
  downloadFile(fullHtml, "report.html", "text/html");
}

/* ---------------------------------------------------------------------
   5. HELPER FUNCTIONS
--------------------------------------------------------------------- */

function mapToObjects(gristData) {
  if (!gristData || !gristData.id) return [];
  return gristData.id.map((_, i) => {
    const obj = {};
    Object.keys(gristData).forEach(key => {
      obj[key] = gristData[key][i];
    });
    return obj;
  });
}

function escapeHtml(text) {
  if (!text) return "";
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function quoteCsv(text) {
  if (!text) return "";
  text = String(text);
  if (text.includes(",") || text.includes("\"") || text.includes("\n")) {
    return `"${text.replace(/"/g, '""')}"`;
  }
  return text;
}

function colorizePerms(pStr) {
  if (!pStr) return "";
  return pStr.replace(/([+-])([a-zA-Z]+)/g, (match, sign, letters) => {
    const color = sign === '+' ? 'green' : 'red';
    return `<span style="color:${color}; font-weight:bold;">${sign}${letters}</span>`;
  });
}

function getTodayDate() {
  const d = new Date();
  return d.toLocaleDateString();
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function notify(msg) {
  const n = $('notification');
  n.textContent = msg;
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 2000);
}

</script>
</body>
</html>
