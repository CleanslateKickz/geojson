<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Email Generator</title>
    
    <!-- Grist Plugin API -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/47.3.0/ckeditor5.css" crossorigin>
    <link rel="stylesheet" href="css/widget.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Pane: Template Library -->
        <div class="controls-pane">
            <header class="controls-header">
                <h2>Message Templates</h2>
                <p>Select a template to generate content.</p>
            </header>

            <main class="controls-main">
                <div class="template-category">
                    <h3>Communication</h3>
                    <div class="template-list">
                        <button class="template-item active" data-template="followUp">
                            <span class="icon">📞</span>
                            <div class="info">
                                <span class="name">Follow-up</span>
                                <span class="desc">Check in regarding specific property</span>
                            </div>
                        </button>
                        <button class="template-item" data-template="introduction">
                            <span class="icon">👋</span>
                            <div class="info">
                                <span class="name">Introduction</span>
                                <span class="desc">General broker introduction</span>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="template-category">
                    <h3>Property</h3>
                    <div class="template-list">
                        <button class="template-item" data-template="investment">
                            <span class="icon">🏢</span>
                            <div class="info">
                                <span class="name">Investment Detail</span>
                                <span class="desc">Full property highlights & table</span>
                            </div>
                        </button>
                        <button class="template-item" data-template="onMarket">
                            <span class="icon">🚀</span>
                            <div class="info">
                                <span class="name">Just Listed</span>
                                <span class="desc">New on-market announcement</span>
                            </div>
                        </button>
                        <button class="template-item" data-template="marketUpdate">
                            <span class="icon">📊</span>
                            <div class="info">
                                <span class="name">Market Update</span>
                                <span class="desc">General market trends</span>
                            </div>
                        </button>
                    </div>
                </div>
            </main>
            
            <footer class="controls-footer">
                <div id="statusMessage" class="status-message"></div>
            </footer>
        </div>

        <!-- Right Pane: Editor -->
        <div class="editor-pane">
            <div class="editor-header">
                <div class="form-group" style="margin-bottom: 0; flex-grow: 1; margin-right: 16px;">
                    <input type="text" id="emailSubject" placeholder="Email Subject" style="font-weight: 500;">
                </div>
                <div class="actions-group">
                    <button id="copySubjectBtn" class="btn btn-secondary btn-sm">Copy Subject</button>
                    <button id="copyEmailBtn" class="btn btn-primary btn-sm">Copy Email Body</button>
                </div>
            </div>
            
            <div class="editor-content">
                <div class="editor-container editor-container_balloon-editor" id="editor-container">
                    <div class="editor-container__editor">
                        <div id="editor"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CKEditor from CDN (Balloon Editor) -->
    <script src="https://cdn.ckeditor.com/ckeditor5/47.3.0/ckeditor5.umd.js" crossorigin></script>

    <!-- Main Application Logic -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
