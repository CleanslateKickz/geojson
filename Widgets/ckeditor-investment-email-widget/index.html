<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Email Widget</title>
    <!-- Grist API -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
/* --- DESIGN SYSTEM --- */
:root {
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --color-bg: #f3f4f6;
    --color-bg-pane: #ffffff;
    --color-border: #e5e7eb;
    --color-text-primary: #111827;
    --color-text-secondary: #6b7280;
    --color-text-muted: #9ca3af;
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-active-bg: #eff6ff;
    --color-success: #10b981;
    --color-danger: #ef4444;
    --color-success-bg: #ecfdf5;
    --color-danger-bg: #fef2f2;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
}

/* --- GENERAL & LAYOUT --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--color-text-primary);
    background-color: var(--color-bg);
    height: 100vh;
    overflow: hidden;
}

.app-container {
    display: flex;
    height: 100%;
    position: relative;
}

/* --- SIDEBAR --- */
.sidebar {
    width: 300px;
    background-color: var(--color-bg-pane);
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: transform 0.3s ease, margin-left 0.3s ease;
    z-index: 100;
}

.sidebar.hidden {
    margin-left: -300px;
}

.sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.sidebar-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
}

.sidebar-content {
    flex-grow: 1;
    overflow-y: auto;
    padding: 12px;
}

.sidebar-footer {
    padding: 16px;
    border-top: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.footer-row {
    display: flex;
    gap: 8px;
}

/* --- MAIN CONTENT --- */
.main-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: #ffffff;
}

/* App Header */
.app-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #ffffff;
}

.header-left, .header-right {
    display: flex;
    gap: 12px;
    align-items: center;
}

/* Metadata Fields */
.email-metadata {
    padding: 12px 20px;
    border-bottom: 1px solid var(--color-border);
}

.metadata-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.metadata-row:last-child {
    margin-bottom: 0;
}

.metadata-row label {
    width: 80px;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
}

.metadata-row input {
    flex-grow: 1;
    border: 1px solid transparent;
    padding: 6px 8px;
    font-size: 14px;
    border-radius: var(--radius-sm);
    transition: border-color 0.2s;
}

.metadata-row input:hover {
    background-color: #f9fafb;
}

.metadata-row input:focus {
    outline: none;
    border-color: var(--color-primary);
    background-color: #ffffff;
}

#emailSubject {
    font-weight: 600;
}

/* Toolbar */
.editor-toolbar {
    padding: 8px 16px;
    background-color: #f9fafb;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 2px;
}

.toolbar-divider {
    width: 1px;
    height: 20px;
    background-color: var(--color-border);
    margin: 0 8px;
}

.toolbar-spacer {
    flex-grow: 1;
}

.tool-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--color-text-secondary);
    transition: background-color 0.2s;
}

.tool-btn:hover {
    background-color: #e5e7eb;
    color: var(--color-text-primary);
}

.tool-btn.active {
    background-color: var(--color-active-bg);
    color: var(--color-primary);
}

.select-toolbar {
    padding: 4px 8px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background-color: #ffffff;
    font-size: 12px;
    font-weight: 500;
}

/* Editor Body */
.editor-container {
    flex-grow: 1;
    overflow-y: auto;
    padding: 40px 20px;
    background-color: #f3f4f6;
    display: flex;
    justify-content: center;
}

#editor {
    width: 100%;
    max-width: 800px;
    min-height: 800px;
    background-color: #ffffff;
    padding: 60px 80px;
    box-shadow: var(--shadow-md);
    border-radius: 2px;
    outline: none;
    font-size: 15px;
    line-height: 1.6;
    color: var(--color-text-primary);
}

#editor:empty:before {
    content: 'Start typing or paste content here...';
    color: var(--color-text-muted);
    pointer-events: none;
}

/* Attachments Area */
.attachments-area {
    padding: 16px 20px;
    border-top: 1px solid var(--color-border);
    background-color: #ffffff;
}

.attachments-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.attachments-header h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
}

.drop-zone {
    border: 2px dashed var(--color-border);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
}

.drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--color-primary);
    background-color: var(--color-active-bg);
}

.drop-zone-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--color-text-secondary);
}

.file-list {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background-color: #f9fafb;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: 12px;
}

.file-remove {
    cursor: pointer;
    color: var(--color-text-muted);
    font-weight: 700;
}

.file-remove:hover {
    color: var(--color-danger);
}

/* --- COMPONENTS --- */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-md);
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
}

.btn-primary {
    background-color: var(--color-primary);
    color: #ffffff;
}

.btn-primary:hover {
    background-color: var(--color-primary-hover);
}

.btn-secondary {
    background-color: #ffffff;
    border-color: var(--color-border);
    color: var(--color-text-primary);
}

.btn-secondary:hover {
    background-color: #f9fafb;
}

.btn-ghost {
    background-color: transparent;
    color: var(--color-text-secondary);
}

.btn-ghost:hover {
    background-color: #f3f4f6;
    color: var(--color-text-primary);
}

.btn-full {
    width: 100%;
}

.btn-sm {
    padding: 4px 10px;
    font-size: 12px;
}

.icon-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--color-text-secondary);
}

.select {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background-color: #ffffff;
    font-size: 13px;
}

.select-sm {
    padding: 4px 8px;
    font-size: 12px;
}

.mode-badge {
    padding: 4px 10px;
    border-radius: 999px;
    background-color: #f3f4f6;
    color: var(--color-text-secondary);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
}

.mode-badge.template {
    background-color: var(--color-active-bg);
    color: var(--color-primary);
}

/* Template Item */
.template-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background-color 0.2s;
}

.template-item:hover {
    background-color: #f9fafb;
}

.template-item.active {
    background-color: var(--color-active-bg);
}

.template-item .icon {
    font-size: 18px;
}

.template-item .info {
    display: flex;
    flex-direction: column;
}

.template-item .name {
    font-size: 13px;
    font-weight: 600;
}

.template-item .desc {
    font-size: 11px;
    color: var(--color-text-secondary);
}

/* Context Menu */
.context-menu {
    position: fixed;
    background-color: #ffffff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    padding: 4px;
    z-index: 1000;
    min-width: 120px;
}

.context-menu-item {
    display: block;
    width: 100%;
    padding: 8px 12px;
    text-align: left;
    background: transparent;
    border: none;
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--radius-sm);
}

.context-menu-item:hover {
    background-color: #f3f4f6;
}

.context-menu-item.danger {
    color: var(--color-danger);
}

.hidden {
    display: none !important;
}

/* Status Message */
.status-message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}

.status-message.show {
    opacity: 1;
}

.status-message.success { background-color: var(--color-success); color: #ffffff; }
.status-message.error { background-color: var(--color-danger); color: #ffffff; }
.status-message.info { background-color: #1f2937; color: #ffffff; }

/* Custom Template Categories Styling */
.template-category {
    margin-bottom: 16px;
}

.template-category h3 {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--color-text-muted);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    padding-left: 4px;
}

.template-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar hidden">
            <header class="sidebar-header">
                <h2>Message Templates</h2>
                <button id="closeSidebarBtn" class="icon-btn">&times;</button>
            </header>
            <div class="sidebar-content">
                <div id="templateCategories">
                    <!-- Templates categories and items will be injected here -->
                </div>
            </div>
            <footer class="sidebar-footer">
                <button id="newTemplateBtn" class="btn btn-secondary btn-full btn-sm">New Template</button>
                <div class="footer-row">
                    <button id="exportTemplatesBtn" class="btn btn-ghost btn-full btn-sm">Export</button>
                    <button id="importTemplatesBtn" class="btn btn-ghost btn-full btn-sm">Import</button>
                </div>
            </footer>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- App Header -->
            <header class="app-header">
                <div class="header-left">
                    <button id="toggleSidebarBtn" class="btn btn-secondary btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                        Templates
                    </button>
                    <select id="attachmentColumnSelect" class="select select-sm">
                        <option value="">-- Attachment Column --</option>
                    </select>
                </div>
                <div class="header-right">
                    <span id="modeBadge" class="mode-badge email">Email</span>
                    <button id="copySubjectBtn" class="btn btn-ghost btn-sm">Copy Subject</button>
                    <button id="copyEmailBtn" class="btn btn-ghost btn-sm">Copy Body</button>
                    <button id="downloadEmlBtn" class="btn btn-primary btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Download .EML

            <!-- Email Metadata -->

                    <label>To</label>
                    <input type="text" id="emailTo" placeholder="Recipients...">
                </div>
                <div class="metadata-row">
                    <label>Cc</label>
                    <input type="text" id="emailCc" placeholder="Cc...">
                </div>
                <div class="metadata-row">
                    <label>Subject</label>
                    <input type="text" id="emailSubject" placeholder="Enter subject line...">

            <!-- Editor Toolbar -->
            <div class="editor-toolbar">
                <div class="toolbar-group">
                    <select id="formatBlock" class="select-toolbar">
                        <option value="p">Paragraph</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="pre">Code</option>
                    </select>
                </div>
                <div class="toolbar-divider"></div>
                <div class="toolbar-group">
                    <button class="tool-btn" data-command="bold" title="Bold"><b>B</b></button>

    <script>
/**
 * Email Templates & Placeholder Logic
 */

const placeholderFields = [
    { key: 'propertyName', label: 'Property Name', token: '{{propertyName}}' },
    { key: 'address', label: 'Address', token: '{{address}}' },
    { key: 'dateListed', label: 'Date Listed', token: '{{dateListed}}' },
    { key: 'propertyType', label: 'Property Type', token: '{{propertyType}}' },
    { key: 'askingPrice', label: 'Asking Price', token: '{{askingPrice}}' },
    { key: 'capRate', label: 'Cap Rate', token: '{{capRate}}' },
    { key: 'leaseTerm', label: 'Lease Term', token: '{{leaseTerm}}' },
    { key: 'buildingSize', label: 'Building Size', token: '{{buildingSize}}' },
    { key: 'landSize', label: 'Land Size', token: '{{landSize}}' },
    { key: 'leaseCommencement', label: 'Lease Commencement', token: '{{leaseCommencement}}' },
    { key: 'leaseExpiration', label: 'Lease Expiration', token: '{{leaseExpiration}}' },
    { key: 'leaseOptions', label: 'Lease Options', token: '{{leaseOptions}}' },
    { key: 'rentBumps', label: 'Rent Bumps', token: '{{rentBumps}}' },
    { key: 'mainImageUrl', label: 'Main Image URL', token: '{{mainImageUrl}}' },
    { key: 'costarLink', label: 'CoStar Link', token: '{{costarLink}}' },
    { key: 'crexiLink', label: 'Crexi Link', token: '{{crexiLink}}' },
    { key: 'omLink', label: 'OM Link', token: '{{omLink}}' },
    { key: 'description_html', label: 'Description (HTML)', token: '{{description_html}}' },
    { key: 'today', label: 'Today', token: '{{today}}' }
];

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function computeData(raw) {
    const description = raw?.description || '';
    const descriptionHtml = description ? escapeHtml(description).replace(/\n/g, '<br>') : '';
    const today = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: '2-digit' }).format(new Date());

    return {
        ...raw,
        description_html: descriptionHtml,
        today
    };
}

function renderTextTemplate(text, data) {
    const ctx = computeData(data || {});
    return String(text || '').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_m, key) => {
        const val = ctx[key];
        return val === undefined || val === null ? '' : String(val);
    });
}

function renderHtmlTemplate(html, data) {
    const ctx = computeData(data || {});
    const rawKeys = new Set(['description_html']);
    return String(html || '').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_m, key) => {
        const val = ctx[key];
        if (val === undefined || val === null) return '';
        if (rawKeys.has(key)) return String(val);
        return escapeHtml(val);
    });
}

/**
 * Grist Integration Handler
 * Maps Grist columns to the widget's internal data structure.
 */

const REQUIRED_ACCESS = 'read table';

function initializeGrist() {
    return new Promise((resolve) => {
        grist.ready({
            columns: [
                { name: "Property_Name", type: "Text", optional: true },
                { name: "Address", type: "Text", optional: true },
                { name: "Date_Listed", type: "Date", optional: true },
                { name: "Property_Type", type: "Choice", optional: true },
                { name: "Price", type: "Numeric", optional: true },
                { name: "Cap_Rate", type: "Numeric", optional: true },
                { name: "Lease_Term", type: "Text", optional: true },
                { name: "RBA", type: "Numeric", optional: true },
                { name: "Notes", type: "Text", optional: true },
                { name: "photo_url", type: "Text", optional: true },
                { name: "CoStar", type: "Text", optional: true },
                { name: "Crexi", type: "Text", optional: true },
                { name: "OM", type: "Text", optional: true },
                { name: "Land_Size", type: "Numeric", optional: true },
                { name: "Lease_Commencement", type: "Date", optional: true },
                { name: "Lease_Expiration", type: "Date", optional: true },
                { name: "Lease_Options", type: "Text", optional: true },
                { name: "Rent_Bumps", type: "Text", optional: true }
            ],
            requiredAccess: REQUIRED_ACCESS
        });
        resolve();
    });
}

function onRecordChange(callback) {
    grist.onRecord((record, mappings) => {
        if (!record) return;
        const mappedData = normalizeRecord(record, mappings);
        callback(mappedData, record);
    });
}

/**
 * Maps raw Grist record to a normalized object.
 */
function normalizeRecord(rec, mappings) {
    const formatCurrency = (val) => {
        if (val === undefined || val === null) return '';
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
    };

    const formatPercent = (val) => {
        if (val === undefined || val === null) return '';
        const num = typeof val === 'number' ? val : Number(val);
        if (!Number.isFinite(num)) return '';
        const pct = num <= 1 ? num * 100 : num;
        return pct.toFixed(2) + '%';
    };

    const formatDate = (val) => {
        if (val === undefined || val === null || val === '') return '';
        let d;
        if (val instanceof Date) {
            d = val;
        } else if (typeof val === 'string') {
            d = new Date(val);
        } else if (typeof val === 'number') {
            if (val > 1e12) d = new Date(val);
            else if (val > 1e9) d = new Date(val * 1000);
            else d = new Date(val * 86400000);
        }
        if (!d || isNaN(d.getTime())) return String(val);
        return new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: '2-digit' }).format(d);
    };

    return {
        propertyName: rec.Property_Name || '',
        address: rec.Address || '',
        dateListed: formatDate(rec.Date_Listed),
        propertyType: rec.Property_Type || '',
        askingPrice: formatCurrency(rec.Price),
        capRate: typeof rec.Cap_Rate === 'number' ? formatPercent(rec.Cap_Rate) : (rec.Cap_Rate || ''),
        leaseTerm: rec.Lease_Term || '',
        buildingSize: rec.RBA ? `${rec.RBA.toLocaleString()} SF` : '',
        description: rec.Notes || '',
        mainImageUrl: (rec.photo_url || '').split(' ')[0],
        costarLink: rec.CoStar || '',
        crexiLink: rec.Crexi || '',
        omLink: rec.OM || '',
        landSize: rec.Land_Size ? `${rec.Land_Size} Acres` : '',
        leaseCommencement: formatDate(rec.Lease_Commencement),
        leaseExpiration: formatDate(rec.Lease_Expiration),
        leaseOptions: rec.Lease_Options || '',
        rentBumps: rec.Rent_Bumps || '',
        // Raw values
        _rawPrice: rec.Price,
        _rawCap: rec.Cap_Rate
    };
}

// --- INITIALIZATION ---

async function init() {
    setupEventListeners();
    loadTemplates();
    populateFieldSelect();

    const preferredActiveId = localStorage.getItem(STORAGE_ACTIVE_ID_KEY);
    activeTemplateId = templates.some(t => t.id === preferredActiveId) ? preferredActiveId : (templates[0]?.id || null);

    renderTemplateList();

    if (window.parent === window) {
        currentGristData = { propertyName: 'Walgreens', address: '123 Main St', askingPrice: '$5,000,000', capRate: '6.50%' };
        regenerateFromTemplate();
    } else {
        await initializeGrist();
        onRecordChange((data, record) => {
            const signature = JSON.stringify(data);
            if (signature === lastRecordSignature) return;
            lastRecordSignature = signature;
            currentGristData = data;
            currentGristRecord = record;

            updateAttachmentColumnSelect(record);

            if (mode === 'email' && !isDirty) {
                regenerateFromTemplate();
            } else if (isDirty) {
                showStatus('Record changed. Click Refresh to update.', 'info');
            }
        });
    }
}

// --- TEMPLATE LOGIC ---

function loadTemplates() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            templates = JSON.parse(raw);
        } else {
            templates = getDefaultTemplates();
            saveTemplates();
        }
    } catch (e) {
        templates = getDefaultTemplates();
    }
}

function saveTemplates() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(templates));
}

function renderTemplateList() {
    ui.templateCategories.innerHTML = '';
    const categories = [...new Set(templates.map(t => t.category || 'Other'))];

    categories.forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'template-category';
        catDiv.innerHTML = `<h3>${cat}</h3>`;

        const list = document.createElement('div');
        list.className = 'template-list';

        templates.filter(t => (t.category || 'Other') === cat).forEach(t => {
            const item = document.createElement('div');
            item.className = `template-item ${t.id === activeTemplateId ? 'active' : ''}`;
            item.innerHTML = `
                <span class="icon">${t.icon || '📄'}</span>
                <div class="info">
                    <span class="name">${t.name}</span>
                    <span class="desc">${t.description || ''}</span>
                </div>
            `;
            item.onclick = () => switchTemplate(t.id);
            item.oncontextmenu = (e) => showContextMenu(e, t.id);
            list.appendChild(item);
        });

        catDiv.appendChild(list);
        ui.templateCategories.appendChild(catDiv);
    });
}

function switchTemplate(id) {
    if (mode === 'template' && isDirty) {
        if (!confirm('Discard unsaved template changes?')) return;
    }
    activeTemplateId = id;
    localStorage.setItem(STORAGE_ACTIVE_ID_KEY, id);
    setMode('email');
    renderTemplateList();
    regenerateFromTemplate();
    showStatus('Template applied', 'success');
}

function regenerateFromTemplate() {
    const tpl = templates.find(t => t.id === activeTemplateId);
    if (!tpl || !currentGristData) return;

    ui.emailSubject.value = renderTextTemplate(tpl.subject, currentGristData);
    ui.editor.innerHTML = renderHtmlTemplate(tpl.bodyHtml, currentGristData);
    isDirty = false;
}

// --- EDITOR LOGIC ---

function format(command, value = null) {
    document.execCommand(command, false, value);
    ui.editor.focus();
}

function setupEventListeners() {
    ui.toggleSidebarBtn.onclick = () => ui.sidebar.classList.toggle('hidden');
    ui.closeSidebarBtn.onclick = () => ui.sidebar.classList.add('hidden');

    document.querySelectorAll('.tool-btn[data-command]').forEach(btn => {
        btn.onclick = () => format(btn.dataset.command);
    });

    ui.formatBlock.onchange = (e) => format('formatBlock', e.target.value);

    ui.textColorBtn.onclick = () => {
        ui.colorInput.oninput = () => format('foreColor', ui.colorInput.value);
        ui.colorInput.click();
    };

    ui.bgColorBtn.onclick = () => {
        ui.colorInput.oninput = () => format('hiliteColor', ui.colorInput.value);
        ui.colorInput.click();
    };

    ui.insertFieldBtn.onclick = () => {
        const token = ui.fieldInsertSelect.value;
        if (!token) return;

        if (document.activeElement === ui.emailSubject) {
            const start = ui.emailSubject.selectionStart;
            const end = ui.emailSubject.selectionEnd;
            ui.emailSubject.value = ui.emailSubject.value.slice(0, start) + token + ui.emailSubject.value.slice(end);
        } else {
            ui.editor.focus();
            format('insertText', token);
        }
    };

    ui.refreshFromTemplateBtn.onclick = () => {
        if (confirm('Refresh email from template? Current changes will be lost.')) {
            regenerateFromTemplate();
        }
    };
    ui.editTemplateBtn.onclick = enterTemplateEdit;
    ui.saveTemplateBtn.onclick = saveTemplateEdit;
    ui.cancelTemplateEditBtn.onclick = cancelTemplateEdit;
    ui.saveAsTemplateBtn.onclick = saveAsNewTemplate;

    ui.copySubjectBtn.onclick = () => {
        navigator.clipboard.writeText(ui.emailSubject.value);
        showStatus('Subject copied', 'success');
    };

    ui.copyEmailBtn.onclick = copyEmailBody;
    ui.downloadEmlBtn.onclick = downloadEml;

    ui.addAttachmentBtn.onclick = () => ui.fileInput.click();
    ui.fileInput.onchange = (e) => handleFiles(e.target.files);
    ui.dropZone.onclick = () => ui.fileInput.click();
    ui.dropZone.ondragover = (e) => { e.preventDefault(); ui.dropZone.classList.add('drag-over'); };
    ui.dropZone.ondragleave = () => ui.dropZone.classList.remove('drag-over');
    ui.dropZone.ondrop = (e) => {
        e.preventDefault();
        ui.dropZone.classList.remove('drag-over');
        handleFiles(e.dataTransfer.files);
    };

    ui.attachmentColumnSelect.onchange = (e) => {
        selectedAttachmentCol = e.target.value;
        localStorage.setItem(STORAGE_ATTACHMENT_COL_KEY, selectedAttachmentCol);
        showStatus('Attachment column updated', 'info');
    };

    ui.newTemplateBtn.onclick = createNewTemplate;
    ui.renameTemplateBtn.onclick = renameTemplate;
    ui.duplicateTemplateBtn.onclick = duplicateTemplate;
    ui.deleteTemplateBtn.onclick = deleteTemplate;

    ui.editor.oninput = () => { if (mode === 'email') isDirty = true; };

    document.addEventListener('click', (e) => {
        if (!ui.contextMenu.contains(e.target)) {
            ui.contextMenu.classList.add('hidden');
        }
    });

    ui.exportTemplatesBtn.onclick = exportTemplates;
    ui.importTemplatesBtn.onclick = importTemplates;

    // Handle paste fidelity
    ui.editor.onpaste = (e) => {
        // We let the browser handle it for maximum fidelity as requested.
        // No e.preventDefault() here.
        isDirty = true;
    };
}

function enterTemplateEdit() {
    const tpl = templates.find(t => t.id === activeTemplateId);
    if (!tpl) return;
    setMode('template');
    ui.emailSubject.value = tpl.subject;
    ui.editor.innerHTML = tpl.bodyHtml;
    showStatus('Editing template...', 'info');
}

function cancelTemplateEdit() {
    setMode('email');
    regenerateFromTemplate();
}

function saveTemplateEdit() {
    const tplIdx = templates.findIndex(t => t.id === activeTemplateId);
    if (tplIdx === -1) return;

    templates[tplIdx].subject = ui.emailSubject.value;
    templates[tplIdx].bodyHtml = ui.editor.innerHTML;
    saveTemplates();
    setMode('email');
    renderTemplateList();
    showStatus('Template saved', 'success');
}

function saveAsNewTemplate() {
    const name = prompt('Template Name:', 'New Template');
    if (!name) return;
    const category = prompt('Category:', 'Custom') || 'Custom';

    const newTpl = {
        id: 't_' + Date.now(),
        name,
        category,
        icon: '⭐',
        subject: ui.emailSubject.value,
        bodyHtml: ui.editor.innerHTML
    };

    templates.push(newTpl);
    saveTemplates();
    activeTemplateId = newTpl.id;
    setMode('email');
    renderTemplateList();
    showStatus('Saved as new template', 'success');
}

function createNewTemplate() {
    const name = prompt('Template Name:', 'New Template');
    if (!name) return;
    const newTpl = {
        id: 't_' + Date.now(),
        name,
        category: 'Custom',
        icon: '📄',
        subject: '{{propertyName}}',

    };

    saveTemplates();

function setMode(newMode) {
    mode = newMode;
    ui.modeBadge.textContent = mode.toUpperCase();
    ui.modeBadge.className = `mode-badge ${mode}`;

    if (mode === 'template') {

function handleFiles(files) {
    Array.from(files).forEach(file => {
        attachments.push({
            name: file.name,
            type: file.type,
            file: file
        });
    });
    renderFileList();
}

function renderFileList() {
    ui.fileList.innerHTML = '';
    attachments.forEach((att, idx) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
            <span>${att.name}</span>
            <span class="file-remove" data-index="${idx}">&times;</span>
        `;
        div.querySelector('.file-remove').onclick = () => removeAttachment(idx);
        ui.fileList.appendChild(div);
    });
}

function removeAttachment(idx) {
    attachments.splice(idx, 1);
    renderFileList();
}

function updateAttachmentColumnSelect(record) {
    const currentVal = selectedAttachmentCol;
    ui.attachmentColumnSelect.innerHTML = '<option value="">-- No Grist Attachment --</option>';

    Object.keys(record).forEach(col => {
        if (col.startsWith('gristHelper') || col === 'id') return;
        const opt = document.createElement('option');
        opt.value = col;
        opt.textContent = col;
        if (col === currentVal) opt.selected = true;
        ui.attachmentColumnSelect.appendChild(opt);
    });
}

function populateFieldSelect() {
    ui.fieldInsertSelect.innerHTML = '<option value="">-- Insert Field --</option>';
    placeholderFields.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.token;
        opt.textContent = f.label;
        ui.fieldInsertSelect.appendChild(opt);
    });
}

function showStatus(msg, type) {
    ui.statusMessage.textContent = msg;
    ui.statusMessage.className = `status-message ${type} show`;
    setTimeout(() => ui.statusMessage.classList.remove('show'), 3000);
}

function showContextMenu(e, id) {
    e.preventDefault();
    contextMenuTargetId = id;
    ui.contextMenu.style.top = `${e.clientY}px`;
    ui.contextMenu.style.left = `${e.clientX}px`;
    ui.contextMenu.classList.remove('hidden');
}

function renameTemplate() {
    const tpl = templates.find(t => t.id === contextMenuTargetId);
    if (!tpl) return;
    const newName = prompt('New Name:', tpl.name);
    if (newName) {
        tpl.name = newName;
        saveTemplates();
        renderTemplateList();
    }
}

function duplicateTemplate() {
    const tpl = templates.find(t => t.id === contextMenuTargetId);
    if (!tpl) return;
    const newTpl = { ...tpl, id: 't_' + Date.now(), name: tpl.name + ' (Copy)' };
    templates.push(newTpl);
    saveTemplates();
    renderTemplateList();
}

function deleteTemplate() {
    const tpl = templates.find(t => t.id === contextMenuTargetId);
    if (!tpl) return;
    if (confirm(`Delete template "${tpl.name}"?`)) {
        templates = templates.filter(t => t.id !== contextMenuTargetId);
        saveTemplates();
        if (activeTemplateId === contextMenuTargetId) {
            activeTemplateId = templates[0]?.id || null;
            regenerateFromTemplate();
        }
        renderTemplateList();
    }
}

// --- EXPORT / IMPORT ---

async function exportTemplates() {
    const json = JSON.stringify(templates, null, 2);
    try {
        await navigator.clipboard.writeText(json);
        showStatus('Templates copied to clipboard', 'success');
    } catch (e) {
        showStatus('Failed to copy', 'error');
    }
}

function importTemplates() {
    const input = prompt('Paste templates JSON:');
    if (!input) return;
    try {
        const parsed = JSON.parse(input);
        if (Array.isArray(parsed)) {
            templates = parsed;
            saveTemplates();
            renderTemplateList();
            showStatus('Templates imported', 'success');
        }
    } catch (e) {
        showStatus('Invalid JSON', 'error');
    }
}

// --- COPY & DOWNLOAD ---

function copyEmailBody() {
    const html = ui.editor.innerHTML;
    const text = ui.editor.innerText;

    if (navigator.clipboard && window.ClipboardItem) {
        const htmlBlob = new Blob([html], { type: 'text/html' });
        const textBlob = new Blob([text], { type: 'text/plain' });
        const item = new ClipboardItem({
            'text/html': htmlBlob,
            'text/plain': textBlob
        });
        navigator.clipboard.write([item]).then(() => {
            showStatus('Body copied (HTML + Text)', 'success');
        }).catch(() => {
            navigator.clipboard.writeText(html).then(() => {
                showStatus('Body copied (HTML only)', 'success');
            });
        });
    } else {
        navigator.clipboard.writeText(html).then(() => {
            showStatus('Body copied (HTML only)', 'success');
        });
    }
}

async function downloadEml() {
    showStatus('Generating EML...', 'info');

    const to = ui.emailTo.value;
    const cc = ui.emailCc.value;
    const subject = ui.emailSubject.value || 'Investment Opportunity';
    const html = ui.editor.innerHTML;
    const text = ui.editor.innerText;

    const allAttachments = [...attachments];

    if (selectedAttachmentCol && currentGristRecord && currentGristRecord[selectedAttachmentCol]) {
        let gristFiles = currentGristRecord[selectedAttachmentCol];
        if (!Array.isArray(gristFiles)) gristFiles = [gristFiles];

        for (const fileId of gristFiles) {
            if (typeof fileId !== 'number') continue;
            try {
                const fileData = await grist.docApi.getAttachment(fileId);
                const fileBlob = new Blob([fileData], { type: 'application/octet-stream' });
                allAttachments.push({
                    name: `OM_${currentGristData?.propertyName || 'Property'}_${fileId}.pdf`,
                    file: fileBlob
                });
            } catch (e) {
                console.error('Failed to fetch Grist attachment', fileId, e);
            }
        }
    }

    try {
        const emlContent = await buildEML(to, cc, subject, html, text, allAttachments);
        const blob = new Blob([emlContent], { type: 'message/rfc822' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${subject.replace(/[^a-z0-9]/gi, '_')}.eml`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showStatus('Download started', 'success');
    } catch (e) {
        console.error(e);
        showStatus('Error generating EML', 'error');
    }
}

async function buildEML(to, cc, subject, html, text, attachmentsList) {
    const boundary = `----=_NextPart_${Math.random().toString(36).substring(2, 15)}`;
    const innerBoundary = `----=_InnerPart_${Math.random().toString(36).substring(2, 15)}`;

    let headers = `MIME-Version: 1.0\r\n`;
    headers += `Date: ${new Date().toUTCString()}\r\n`;
    headers += `Subject: ${subject}\r\n`;
    if (to) headers += `To: ${to}\r\n`;
    if (cc) headers += `Cc: ${cc}\r\n`;
    headers += `From: <sender@example.com>\r\n`;

    let body = "";

    if (attachmentsList.length === 0) {
        headers += `Content-Type: multipart/alternative; boundary="${boundary}"\r\n\r\n`;
        body += `--${boundary}\r\nContent-Type: text/plain; charset="utf-8"\r\n\r\n${text}\r\n\r\n`;
        body += `--${boundary}\r\nContent-Type: text/html; charset="utf-8"\r\n\r\n<html><body>${html}</body></html>\r\n\r\n`;
        body += `--${boundary}--\r\n`;
    } else {
        headers += `Content-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n`;

        body += `--${boundary}\r\nContent-Type: multipart/alternative; boundary="${innerBoundary}"\r\n\r\n`;
        body += `--${innerBoundary}\r\nContent-Type: text/plain; charset="utf-8"\r\n\r\n${text}\r\n\r\n`;
        body += `--${innerBoundary}\r\nContent-Type: text/html; charset="utf-8"\r\n\r\n<html><body>${html}</body></html>\r\n\r\n`;
        body += `--${innerBoundary}--\r\n\r\n`;

        for (const att of attachmentsList) {
            const base64 = await blobToBase64(att.file);
            body += `--${boundary}\r\n`;
            body += `Content-Type: ${att.type || 'application/octet-stream'}; name="${att.name}"\r\n`;
            body += `Content-Transfer-Encoding: base64\r\n`;
            body += `Content-Disposition: attachment; filename="${att.name}"\r\n\r\n`;
            body += `${base64}\r\n\r\n`;
        }
        body += `--${boundary}--\r\n`;
    }

    return headers + body;
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}
