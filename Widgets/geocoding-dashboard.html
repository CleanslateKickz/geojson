<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Geocoding Progress Dashboard</title>
  <style>
    .geocoding-dashboard {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .table-name {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
    }

    .total-badge {
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card-body {
      padding: 20px;
    }

    .progress-container {
      margin-bottom: 16px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 10px;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 5px;
      transition: width 0.6s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .stat-item {
      text-align: center;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 4px;
    }

    .dashboard-header {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .last-updated {
      font-size: 12px;
      color: #94a3b8;
      text-align: right;
      margin-top: 8px;
    }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="geocoding-dashboard">
    <div class="dashboard-header">
      📍 Geocoding Progress
    </div>

    <div data-bind="if: tables().length === 0">
      <div class="card">
        <div class="card-body">
          <div class="loading">Loading data...</div>
        </div>
      </div>
    </div>

    <!-- ko foreach: tables -->
    <div class="card">
      <div class="card-header">
        <span class="table-name" data-bind="text: name"></span>
        <span class="total-badge" data-bind="text: total + ' total'"></span>
      </div>
      <div class="card-body">
        <div class="progress-container">
          <div class="progress-labels">
            <span>Geocoded</span>
            <span data-bind="text: geocoded + ' (' + percentage + '%)'"></span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" data-bind="style: { width: percentage + '%' }"></div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-value" data-bind="text: geocoded"></div>
            <div class="stat-label">With Coordinates</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" data-bind="text: missing"></div>
            <div class="stat-label">Remaining</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" data-bind="text: percentage"></div>
            <div class="stat-label">% Done</div>
          </div>
        </div>
      </div>
    </div>
    <!-- /ko -->

    <div class="last-updated" data-bind="text: 'Last updated: ' + lastUpdated()"></div>
  </div>

  <!-- We'll load Knockout using Grist's safe method -->
  <script>
    (function() {
      // ✅ Step 1: Wait for `grist.rpc` to be available
      if (typeof grist !== 'undefined' && grist.rpc) {
        startWidget();
      } else {
        window.addEventListener('message', function(event) {
          if (event.data?.type === 'GRIST_READY') {
            startWidget();
          }
        });
      }

      function startWidget() {
        // ✅ Step 2: Load Knockout using Grist's API (safe in sandboxed iframe)
        grist.loadScript('https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.min.js')
          .then(() => {
            // ✅ Step 3: Now that Knockout is loaded, initialize
            init();
          })
          .catch(err => {
            console.error("Failed to load Knockout", err);
          });
      }

      function init() {
        const ko = window.ko;

        function TableStatus(name, total, geocoded) {
          this.name = name;
          this.total = total;
          this.geocoded = geocoded;
          this.missing = total - geocoded;
          this.percentage = total > 0 ? Math.round((geocoded / total) * 100) : 0;
        }

        function ViewModel() {
          this.tables = ko.observableArray([]);
          this.lastUpdated = ko.observable('never');

          const self = this;

          async function fetchData() {
            try {
              const costar = await grist.docData.fetchTable('CoStarExport');
              const locations = await grist.docData.fetchTable('Locations');

              const costarRows = costar?.[3] || [];
              const locRows = locations?.[3] || [];

              const countValid = (rows, lon, lat) => {
                return rows.filter(r => {
                  const x = r[lon], y = r[lat];
                  return typeof x === 'number' && typeof y === 'number' && !isNaN(x) && !isNaN(y) && (Math.abs(x) > 1e-6 || Math.abs(y) > 1e-6);
                }).length;
              };

              const data = [
                new TableStatus('CoStar Export', costarRows.length, countValid(costarRows, 'Longitude', 'Latitude')),
                new TableStatus('Locations', locRows.length, countValid(locRows, 'Long', 'Lat'))
              ];

              self.tables(data);
              self.lastUpdated(new Date().toLocaleString());

            } catch (err) {
              console.error("Data fetch failed", err);
              self.lastUpdated("Error: " + err.message);
            }
          }

          // ✅ Step 4: Tell Grist we're ready, then fetch data
          grist.ready({
            requiredAccess: 'readonly',  // ✅ Only read data
            volatile: true,              // ✅ Auto-refresh when data changes
          });

          // Listen to changes
          grist.onRecordsChange(fetchData);

          // Initial fetch
          fetchData();

          // Refresh every 5 min
          setInterval(fetchData, 300000);
        }

        // ✅ Step 5: Apply bindings after DOM ready
        ko.applyBindings(new ViewModel());
      }
    })();
  </script>
</body>
</html>
