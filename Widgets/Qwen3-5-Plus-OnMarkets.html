<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Listings</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --success: #059669;
  --warning: #f59e0b;
  --danger: #dc2626;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
}

html, body {
  overflow-x: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--slate-50);
  color: var(--slate-900);
  line-height: 1.6;
}

.container {
  max-width: 1800px;
  margin: 0 auto;
  padding: 1rem;
}

/* Stats Bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 0.6rem;
  margin-bottom: 1rem;
}

.stat-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 0.85rem 1rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--slate-200);
}

.stat-label {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--slate-500);
  margin-bottom: 0.2rem;
}

.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--slate-900);
}

.stat-value.accent { color: var(--success); }
.stat-value.primary { color: var(--primary); }

/* Controls Bar */
.controls-bar {
  background: white;
  border-radius: var(--radius-xl);
  padding: 0.85rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  align-items: center;
  border: 1px solid var(--slate-200);
}

.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 0.55rem 0.75rem 0.55rem 2.5rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  transition: all 0.2s;
  background: var(--slate-50);
}

.search-box input:focus {
  outline: none;
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

.search-box svg {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  stroke: var(--slate-400);
}

.filter-group {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  align-items: center;
}

.filter-select {
  padding: 0.55rem 0.8rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  background: white;
  color: var(--slate-600);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  min-width: 120px;
}

.filter-select:hover {
  border-color: var(--slate-300);
}

.filter-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

/* Range Inputs */
.range-inputs {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--slate-50);
  padding: 0.35rem 0.5rem;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--slate-200);
}

.range-inputs input {
  width: 70px;
  padding: 0.35rem 0.4rem;
  border: 1px solid var(--slate-200);
  border-radius: 4px;
  font-size: 0.8rem;
  text-align: center;
}

.range-inputs input:focus {
  outline: none;
  border-color: var(--primary);
}

.range-inputs span {
  color: var(--slate-400);
  font-weight: 500;
  font-size: 0.8rem;
}

/* Sort Button */
.sort-container {
  position: relative;
}

.sort-btn {
  padding: 0.55rem 0.8rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  background: white;
  color: var(--slate-600);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: inherit;
}

.sort-btn:hover {
  border-color: var(--slate-300);
  background: var(--slate-50);
}

.sort-dropdown {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 0.4rem;
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--slate-200);
  min-width: 170px;
  z-index: 1000;
  display: none;
  overflow: hidden;
}

.sort-dropdown.show {
  display: block;
}

.sort-dropdown button {
  width: 100%;
  padding: 0.6rem 0.85rem;
  border: none;
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-size: 0.83rem;
  color: var(--slate-700);
  transition: background 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: inherit;
}

.sort-dropdown button:hover {
  background: var(--slate-50);
}

.sort-dropdown button.active {
  background: var(--slate-100);
  color: var(--primary);
  font-weight: 600;
}

/* View Toggle */
.view-toggle {
  display: flex;
  background: var(--slate-100);
  border-radius: var(--radius-md);
  padding: 3px;
  border: 1.5px solid var(--slate-200);
}

.view-toggle button {
  padding: 0.45rem 0.6rem;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--slate-500);
}

.view-toggle button.active {
  background: white;
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

.view-toggle button svg {
  width: 16px;
  height: 16px;
}

/* Export Button */
.export-btn {
  padding: 0.55rem 0.85rem;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-md);
  background: white;
  color: var(--slate-600);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: inherit;
}

.export-btn:hover {
  border-color: var(--slate-300);
  background: var(--slate-50);
}

.export-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.export-btn svg {
  width: 15px;
  height: 15px;
}

/* Property Grid */
.property-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}

.property-grid.card-view {
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
}

.property-grid.list-view {
  grid-template-columns: 1fr;
}

.property-grid.compact-view {
  grid-template-columns: 1fr;
  gap: 0.5rem;
}

/* Property Card */
.property-card {
  background: white;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--slate-200);
  transition: all 0.25s;
  cursor: pointer;
}

.property-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary);
}

/* Card View */
.property-grid.card-view .property-card {
  display: block;
}

.property-grid.card-view .card-image-container {
  position: relative;
  height: 200px;
  overflow: hidden;
  background: var(--slate-100);
}

.property-grid.card-view .card-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
}

.property-grid.card-view .property-card:hover .card-image {
  transform: scale(1.06);
}

.property-grid.card-view .card-skeleton {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--slate-100) 25%, var(--slate-200) 50%, var(--slate-100) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.property-grid.card-view .card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 40%, transparent 100%);
  pointer-events: none;
}

.property-grid.card-view .card-badges {
  position: absolute;
  top: 0.65rem;
  left: 0.65rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  z-index: 5;
}

.property-grid.card-view .badge {
  padding: 0.3rem 0.55rem;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--slate-800);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.property-grid.card-view .badge.new {
  background: var(--success);
  color: white;
}

.property-grid.card-view .badge.tenancy {
  background: var(--primary);
  color: white;
}

.property-grid.card-view .select-checkbox {
  position: absolute;
  top: 0.65rem;
  right: 0.65rem;
  width: 28px;
  height: 28px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  z-index: 10;
  border: 2px solid var(--slate-200);
}

.property-grid.card-view .select-checkbox:hover {
  background: white;
  transform: scale(1.1);
  border-color: var(--primary);
}

.property-grid.card-view .select-checkbox input {
  width: 15px;
  height: 15px;
  cursor: pointer;
  accent-color: var(--primary);
}

.property-grid.card-view .card-content {
  padding: 0.95rem;
}

.property-grid.card-view .property-type {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--slate-500);
  margin-bottom: 0.25rem;
}

.property-grid.card-view .property-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--slate-900);
  margin-bottom: 0.3rem;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.property-grid.card-view .property-address {
  font-size: 0.8rem;
  color: var(--slate-500);
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin-bottom: 0.65rem;
}

.property-grid.card-view .property-address svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.property-grid.card-view .card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 0.65rem;
  border-top: 1px solid var(--slate-200);
}

.property-grid.card-view .price {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--success);
}

.property-grid.card-view .cap-rate {
  font-size: 0.8rem;
  color: var(--slate-600);
}

.property-grid.card-view .cap-rate-value {
  font-weight: 700;
  color: var(--primary);
}

/* List View */
.property-grid.list-view .property-card {
  display: flex;
  flex-direction: row;
  align-items: stretch;
}

.property-grid.list-view .card-image-container {
  width: 280px;
  height: auto;
  min-height: 180px;
  flex-shrink: 0;
  position: relative;
  background: var(--slate-100);
}

.property-grid.list-view .card-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.property-grid.list-view .card-skeleton {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--slate-100) 25%, var(--slate-200) 50%, var(--slate-100) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.property-grid.list-view .card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
  pointer-events: none;
}

.property-grid.list-view .card-badges {
  position: absolute;
  top: 0.65rem;
  left: 0.65rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  z-index: 5;
}

.property-grid.list-view .badge {
  padding: 0.3rem 0.55rem;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--slate-800);
  text-transform: uppercase;
}

.property-grid.list-view .badge.new {
  background: var(--success);
  color: white;
}

.property-grid.list-view .badge.tenancy {
  background: var(--primary);
  color: white;
}

.property-grid.list-view .select-checkbox {
  position: absolute;
  top: 0.65rem;
  right: 0.65rem;
  width: 28px;
  height: 28px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  border: 2px solid var(--slate-200);
}

.property-grid.list-view .select-checkbox input {
  width: 15px;
  height: 15px;
  cursor: pointer;
  accent-color: var(--primary);
}

.property-grid.list-view .card-content {
  flex: 1;
  padding: 1rem 1.25rem;
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr;
  gap: 1rem;
  align-items: center;
}

.property-grid.list-view .card-main-info {
  min-width: 0;
}

.property-grid.list-view .property-type {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--slate-500);
  margin-bottom: 0.2rem;
}

.property-grid.list-view .property-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--slate-900);
  margin-bottom: 0.25rem;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.property-grid.list-view .property-address {
  font-size: 0.78rem;
  color: var(--slate-500);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.property-grid.list-view .list-metric {
  text-align: center;
}

.property-grid.list-view .list-metric-label {
  font-size: 0.6rem;
  color: var(--slate-400);
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 0.2rem;
}

.property-grid.list-view .list-metric-value {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--slate-900);
}

.property-grid.list-view .list-metric-value.price { color: var(--success); }
.property-grid.list-view .list-metric-value.cap { color: var(--primary); }

/* Compact View */
.property-grid.compact-view .property-card {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 0.65rem 0.85rem;
  gap: 0.75rem;
}

.property-grid.compact-view .card-image-container {
  width: 80px;
  height: 60px;
  flex-shrink: 0;
  position: relative;
  background: var(--slate-100);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.property-grid.compact-view .card-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.property-grid.compact-view .card-skeleton {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--slate-100) 25%, var(--slate-200) 50%, var(--slate-100) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.property-grid.compact-view .select-checkbox {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  background: var(--slate-100);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid var(--slate-200);
}

.property-grid.compact-view .select-checkbox input {
  width: 14px;
  height: 14px;
  cursor: pointer;
  accent-color: var(--primary);
}

.property-grid.compact-view .card-content {
  flex: 1;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 0.75rem;
  align-items: center;
}

.property-grid.compact-view .compact-info {
  min-width: 0;
}

.property-grid.compact-view .compact-name {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--slate-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.15rem;
}

.property-grid.compact-view .compact-address {
  font-size: 0.72rem;
  color: var(--slate-500);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.property-grid.compact-view .compact-metric {
  text-align: center;
}

.property-grid.compact-view .compact-metric-label {
  font-size: 0.55rem;
  color: var(--slate-400);
  text-transform: uppercase;
  font-weight: 600;
}

.property-grid.compact-view .compact-metric-value {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--slate-900);
}

.property-grid.compact-view .compact-metric-value.price { color: var(--success); }
.property-grid.compact-view .compact-metric-value.cap { color: var(--primary); }

.property-grid.compact-view .compact-tenancy {
  text-align: center;
}

.property-grid.compact-view .tenancy-badge {
  display: inline-block;
  padding: 0.2rem 0.5rem;
  background: var(--slate-100);
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--slate-700);
}

.property-grid.compact-view .tenancy-badge.stnl { background: #dbeafe; color: #1e40af; }
.property-grid.compact-view .tenancy-badge.multi { background: #fef3c7; color: #92400e; }
.property-grid.compact-view .tenancy-badge.center { background: #d1fae5; color: #065f46; }

/* Status */
.status-message {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--slate-500);
}

.loading-spinner {
  width: 40px;
  height: 40px;
  margin: 0 auto 1rem;
  border: 3px solid var(--slate-200);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Detail Panel */
.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  z-index: 1200;
  align-items: stretch;
  justify-content: flex-end;
}

.detail-overlay.show {
  display: flex;
}

.detail-panel {
  width: 100%;
  max-width: 580px;
  background: white;
  height: 100vh;
  box-shadow: -8px 0 32px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.detail-header {
  position: relative;
  height: 180px;
  flex-shrink: 0;
}

.detail-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.detail-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent 60%);
}

.detail-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.2);
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  backdrop-filter: blur(8px);
}

.detail-close:hover {
  background: rgba(255,255,255,0.35);
  transform: scale(1.1);
}

.detail-title {
  position: absolute;
  left: 0;
  bottom: 0;
  padding: 1rem;
  color: white;
  width: 100%;
}

.detail-badges {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.4rem;
}

.lease-badge {
  background: var(--primary);
  padding: 0.25rem 0.6rem;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.detail-title h2 {

<script>
// ============= CONFIG =============
const CONFIG = {
  DEBOUNCE_DELAY: 200,
  MAX_CACHED: 1000
};

// ============= DOM CACHE =============
const dom = {
  grid: document.getElementById('property-grid'),
  statusMessage: document.getElementById('status-message'),
  searchInput: document.getElementById('search-input'),
  typeFilter: document.getElementById('type-filter'),
  tenancyFilter: document.getElementById('tenancy-filter'),
  cityFilter: document.getElementById('city-filter'),
  priceMin: document.getElementById('price-min'),
  priceMax: document.getElementById('price-max'),
  capMin: document.getElementById('cap-min'),
  capMax: document.getElementById('cap-max'),
  exportBtn: document.getElementById('export-btn'),
  exportModal: document.getElementById('export-modal'),
  detailOverlay: document.getElementById('detail-overlay'),
  detailClose: document.getElementById('detail-close'),
  sortBtn: document.getElementById('sort-btn'),
  sortDropdown: document.getElementById('sort-dropdown'),
  viewCard: document.getElementById('view-card'),
  viewList: document.getElementById('view-list'),
  viewCompact: document.getElementById('view-compact')
};

// ============= STATE =============
let state = {
  allRecords: [],
  filteredRecords: [],
  normalizedCache: new Map(),
  selectedIds: new Set(),
  currentRecord: null,
  currentSort: 'newest',
  currentView: 'card',
  filters: {
    search: '',
    type: 'all',
    tenancy: 'all',
    city: 'all',
    priceMin: null,
    priceMax: null,
    capMin: null,
    capMax: null
  }
};

// ============= UTILITIES =============

function debounce(func, wait) {
  let timeout;
  return function(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

// Grist timestamps are in seconds
function normalizeTimestamp(val) {
  if (!val) return null;
  const num = Number(val);
  if (!num || num < 1000000000) return null;
  return num > 10000000000 ? num : num * 1000;
}

function formatDate(val) {
  const ts = normalizeTimestamp(val);
  if (!ts) return 'N/A';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return 'N/A';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function getDaysOnMarket(val) {
  const ts = normalizeTimestamp(val);
  if (!ts) return null;
  const diff = Math.floor((Date.now() - ts) / 86400000);
  return diff < 0 ? 0 : diff;
}

function formatPrice(price) {
  if (price == null || !Number.isFinite(price)) return 'Contact';
  return '$' + new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(price);
}

// Grist stores cap rate as decimal (0.0791 = 7.91%)
function formatCapRate(rate) {
  if (rate == null || !Number.isFinite(rate)) return 'N/A';
  const val = Number(rate);
  return (val > 1 ? val : val * 100).toFixed(2) + '%';
}

function formatSF(sf) {
  if (!sf) return 'N/A';
  return Number(sf).toLocaleString() + ' SF';
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function parseMarkdown(text) {
  if (!text) return '';
  try {
    return marked.parse(text, { breaks: true });
  } catch (e) {
    return escapeHtml(text);
  }
}

// FIX: Properly extract tenant from Grist array format ["L", "Tenant Name"]
function extractTenant(val) {
  if (val === null || val === undefined) return '';
  
  // Handle Grist array format: ["L", "Tenant Name"]
  if (Array.isArray(val)) {
    // Filter out "L" prefix and empty values, return the actual tenant name
    const filtered = val.filter(v => {
      if (v === null || v === undefined) return false;
      const str = String(v).trim();
      return str !== '' && str !== 'L';
    });
    return filtered.join(', ') || '';
  }
  
  // Handle Grist object format: {L: ["L", "Tenant Name"]}
  if (typeof val === 'object' && val.L) {
    return extractTenant(val.L);
  }
  
  // Handle string format
  const str = String(val).trim();
  if (str === 'L' || str === '') return '';
  return str;
}

function extractImageUrls(record) {
  const fields = record.fields || record;
  const photoUrl = fields.photo_url || fields.Photo_url || fields.Photo_URL || '';
  if (!photoUrl) return [];
  return photoUrl.split(/\s+/).filter(url => url && url.startsWith('http')).slice(0, 5);
}

function extractCity(address) {
  if (!address) return '';
  const parts = address.split(',').map(p => p.trim());
  return parts[parts.length - 2] || '';
}

// ============= NORMALIZE =============
function normalize(record) {
  const id = String(record.id);
  
  if (state.normalizedCache.has(id)) {
    return state.normalizedCache.get(id);
  }

  const fields = record.fields || record;

  const data = {
    id,
    propertyName: fields.Property_Name || 'Property',
    address: fields.Address || '',
    city: fields.City || extractCity(fields.Address) || '',
    state: fields.State || '',
    zip: fields.Zip || '',
    price: fields.Price != null ? Number(fields.Price) : null,
    capRate: fields.Cap_Rate != null ? Number(fields.Cap_Rate) : null,
    rba: fields.RBA != null ? Number(fields.RBA) : null,
    landSize: fields.Land_Size != null ? Number(fields.Land_Size) : null,
    leaseTerm: fields.Lease_Term || '',
    leaseType: fields.Lease_Type || '',
    leaseExpiration: fields.Lease_Expiration || null,
    leaseOptions: fields.Lease_Options || '',
    rentBumps: fields.Rent_Bumps || '',
    tenantName: extractTenant(fields.Tenant_s_),
    dateListed: fields.Date_Listed || null,
    imageUrls: extractImageUrls(record),
    omUrl: fields.OM || '',
    costarUrl: fields.CoStar || '',
    crexiUrl: fields.Crexi || '',
    tenancy: fields.Tenancy || '',
    notes: fields.Notes || '',
    propertyType: fields.Property_Type || '',
    priceSf: fields.Price_SF != null ? Number(fields.Price_SF) : null,
    lastUpdated: fields.Last_updated_at || fields.Created_at || null
  };

  if (data.noi == null && data.price != null && data.capRate != null) {
    data.noi = data.price * data.capRate;
  }

  if (state.normalizedCache.size >= CONFIG.MAX_CACHED) {
    const firstKey = state.normalizedCache.keys().next().value;
    state.normalizedCache.delete(firstKey);
  }
  state.normalizedCache.set(id, data);

  return data;
}

function renderProperties(records) {
  if (!records || records.length === 0) {
    dom.grid.innerHTML = '';
    dom.statusMessage.style.display = 'block';
    dom.statusMessage.innerHTML = '<div style="font-size:2.5rem;margin-bottom:0.75rem;">📭</div><div>No properties found</div><div style="margin-top:0.4rem;font-size:0.85rem;color:var(--slate-400)">Adjust your filters</div>';
    return;
  }

  dom.statusMessage.style.display = 'none';
  
  const html = records.map(record => createPropertyCard(record)).join('');
  dom.grid.innerHTML = html;

  dom.grid.querySelectorAll('.card-image').forEach(img => {
    const skeleton = img.parentElement.querySelector('.card-skeleton');
    img.onload = () => {
      img.classList.remove('loading');
      if (skeleton) skeleton.style.display = 'none';
    };
    img.onerror = () => {
      img.src = 'https://placehold.co/600x400/e2e8f0/64748b?text=No+Image';
      img.classList.remove('loading');
      if (skeleton) skeleton.style.display = 'none';
    };
  });

  updateExportButton();
  updateStats();
}

// ============= FILTERING =============

function applyFilters() {
  const { search, type, tenancy, city, priceMin, priceMax, capMin, capMax } = state.filters;
  
  state.filteredRecords = state.allRecords.filter(record => {
    const d = normalize(record);
    
    const matchesSearch = !search ||
      d.propertyName.toLowerCase().includes(search) ||
      d.address.toLowerCase().includes(search) ||
      d.city.toLowerCase().includes(search);
    
    const matchesType = type === 'all' || d.propertyType === type;
    const matchesTenancy = tenancy === 'all' || d.tenancy === tenancy;
    const matchesCity = city === 'all' || d.city === city;
    
    const matchesPriceMin = priceMin == null || d.price == null || d.price >= priceMin;
    const matchesPriceMax = priceMax == null || d.price == null || d.price <= priceMax;
    const matchesPrice = matchesPriceMin && matchesPriceMax;
    
    const capRatePercent = d.capRate != null ? (d.capRate > 1 ? d.capRate : d.capRate * 100) : null;
    const matchesCapMin = capMin == null || capRatePercent == null || capRatePercent >= capMin;
    const matchesCapMax = capMax == null || capRatePercent == null || capRatePercent <= capMax;
    const matchesCap = matchesCapMin && matchesCapMax;
    
    return matchesSearch && matchesType && matchesTenancy && matchesCity && matchesPrice && matchesCap;
  });

  sortRecords();
  renderProperties(state.filteredRecords);
}

function sortRecords() {
  const sort = state.currentSort;
  
  state.filteredRecords.sort((a, b) => {
    const da = normalize(a);
    const db = normalize(b);
    
    switch (sort) {
      case 'price-asc': return (da.price || 0) - (db.price || 0);
      case 'price-desc': return (db.price || 0) - (da.price || 0);
      case 'cap-asc': return (da.capRate || 0) - (db.capRate || 0);
      case 'cap-desc': return (db.capRate || 0) - (da.capRate || 0);
      case 'newest':
      default:
        const dateA = normalizeTimestamp(da.lastUpdated);
        const dateB = normalizeTimestamp(db.lastUpdated);
        return (dateB || 0) - (dateA || 0);
    }
  });
}

function populateFilters(records) {
  const types = [...new Set(records.map(r => normalize(r).propertyType).filter(Boolean))].sort();
  dom.typeFilter.innerHTML = '<option value="all">All Types</option>';
  types.forEach(type => {
    const option = document.createElement('option');
    option.value = type;
    option.textContent = type;
    dom.typeFilter.appendChild(option);
  });

  const cities = [...new Set(records.map(r => normalize(r).city).filter(Boolean))].sort();
  dom.cityFilter.innerHTML = '<option value="all">All Cities</option>';
  cities.forEach(city => {
    const option = document.createElement('option');
    option.value = city;
    option.textContent = city;
    dom.cityFilter.appendChild(option);
  });
}

function updateStats() {
  document.getElementById('stat-total').textContent = state.allRecords.length;
  document.getElementById('stat-selected').textContent = state.selectedIds.size;
  
  const prices = state.filteredRecords.map(r => normalize(r).price).filter(p => p != null && Number.isFinite(p));
  if (prices.length > 0) {
    const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
    document.getElementById('stat-avg-price').textContent = formatPrice(avgPrice);
  } else {
    document.getElementById('stat-avg-price').textContent = '$0';
  }
  
  const caps = state.filteredRecords.map(r => normalize(r).capRate).filter(c => c != null && Number.isFinite(c));
  if (caps.length > 0) {
    const avgCap = caps.reduce((a, b) => a + b, 0) / caps.length;
    document.getElementById('stat-avg-cap').textContent = formatCapRate(avgCap);
  } else {
    document.getElementById('stat-avg-cap').textContent = 'N/A';
  }
}

function toggleSelection(id) {
  const strId = String(id);
  if (state.selectedIds.has(strId)) {
    state.selectedIds.delete(strId);
  } else {
    state.selectedIds.add(strId);
  }
  
  const card = dom.grid.querySelector(`[data-id="${strId}"]`);
  if (card) {
    const checkbox = card.querySelector('.select-checkbox input');
    if (checkbox) checkbox.checked = state.selectedIds.has(strId);
  }
  
  updateExportButton();
  updateStats();
}

function updateExportButton() {
  const labelEl = dom.exportBtn.querySelector('.export-label');
  const count = state.selectedIds.size;
  if (labelEl) labelEl.textContent = count > 0 ? `Export (${count})` : 'Export';
  dom.exportBtn.disabled = !state.filteredRecords || state.filteredRecords.length === 0;
  dom.exportBtn.classList.toggle('active', count > 0);
}

  }

function closePropertyPanel() {
  dom.detailOverlay.classList.remove('show');
  state.currentRecord = null;
  document.body.style.overflow = '';
}

function closeExportModal() {
  dom.exportModal.classList.remove('show');
}

function performExport() {
  const recordsToExport = state.selectedIds.size > 0
    ? state.allRecords.filter(r => state.selectedIds.has(String(r.id)))
    : state.filteredRecords;
    
  if (recordsToExport.length === 0) {
    alert('No properties to export');
    closeExportModal();
    return;
  }
  
  const html = generateExportHTML(recordsToExport);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `properties-${new Date().toISOString().slice(0, 10)}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeExportModal();
}

function generateExportHTML(records) {
  const cards = records.map(record => {
    const d = normalize(record);
    const imageUrl = d.imageUrls[0] || `https://placehold.co/600x400/e2e8f0/64748b?text=${encodeURIComponent(d.propertyName)}`;
    return `
      <div style="background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
        <img src="${imageUrl}" style="width:100%;height:200px;object-fit:cover">
        <div style="padding:16px">
          <h2 style="margin:0 0 8px;font-size:1.1rem">${escapeHtml(d.propertyName)}</h2>
          <p style="color:var(--success);font-weight:bold;margin:0 0 8px">${formatPrice(d.price)}</p>
          <p style="color:#64748b;font-size:0.85rem;margin:0">${escapeHtml(d.address)}</p>
          <p style="font-size:0.85rem;margin:8px 0 0">Cap: ${formatCapRate(d.capRate)} | Size: ${formatSF(d.rba)} | Tenant: ${escapeHtml(d.tenantName) || 'N/A'}</p>
          ${d.notes ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:0.85rem;color:#64748b">${parseMarkdown(d.notes)}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
  
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title></head><body style="font-family:Arial,sans-serif;margin:20px;background:#f8fafc"><div style="max-width:1200px;margin:0 auto"><h1 style="text-align:center;margin-bottom:24px">Properties - ${new Date().toLocaleDateString()}</h1><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">${cards}</div></div></body></html>`;
}

dom.grid.addEventListener('click', (e) => {

  const id = card.dataset.id;
  
  if (e.target.closest('a')) {
    e.stopPropagation();
    return;
  }
  
  const checkbox = e.target.closest('.select-checkbox');
  if (checkbox) {
    e.stopPropagation();
    toggleSelection(id);
    return;
  }
  
  const record = state.filteredRecords.find(r => String(r.id) === id);
  if (record) openPropertyPanel(record);
});

grist.onRecords((records, mappings) => {
  // FIX: Force scroll to top on data load to prevent auto-scroll
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  
  state.allRecords = grist.mapColumnNames(records, mappings) || [];
  state.normalizedCache.clear();
  
  dom.searchInput.disabled = false;
  dom.typeFilter.disabled = false;
  dom.tenancyFilter.disabled = false;
  dom.cityFilter.disabled = false;
  dom.priceMin.disabled = false;
  dom.priceMax.disabled = false;
  dom.capMin.disabled = false;
  dom.capMax.disabled = false;
  dom.exportBtn.disabled = false;
  
  populateFilters(state.allRecords);
  applyFilters();
});

grist.onRecord((record, mappings) => {
  if (record && record.id) {
    const normalizedId = String(record.id);
    const card = dom.grid.querySelector(`[data-id="${normalizedId}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'top' });
      card.style.boxShadow = '0 0 0 3px var(--primary)';
      setTimeout(() => {
        card.style.boxShadow = '';
      }, 2000);
    }
  }
});
</script>
</body>
</html>
