<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Listings Widget with Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/x-icon" href="../Images/for-sale-retail.png">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff;
            background-image: linear-gradient(to bottom, #f0f9ff, #ffffff);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        .img-overlay-chip {
            background: rgba(24,24,27,0.55);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: 999px;
            padding: 2px 9px;
            min-width: 28px;
            min-height: 1.3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.09);
            letter-spacing: 0.01em;
            border: none;
        }
        .filter-floatbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(5px);
            border-radius: 0.75rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            padding: 0.75rem;
            position: sticky;
            top: 1rem;
            z-index: 30;
            margin-bottom: 2rem;
            max-width: 820px;
            margin-left: auto;
            margin-right: auto;
        }
        .filter-group {
            flex: 1;
            position: relative; /* For dropdown positioning */
        }
        .filter-select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 0.95rem;
            border-radius: 0.5rem;
            border: 1px solid #0c1017;
            background: #fff;
            color: #565656;
            transition: all 0.2s;
        }
        .filter-select:focus {
            outline: none;
            border-color: #93c5fd;
            box-shadow: 0 0 0 1px #93c5fd;
        }
        .filter-reset-btn, .filter-order-btn {
            padding: 0.5rem;
            font-size: 1.2rem;
            border-radius: 0.5rem;
            background: #cee1fa;
            color: #fff;
            border: none;
            transition: background 0.2s;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .filter-reset-btn:hover, .filter-order-btn:hover {
            background: #89b7f3;
        }
        .filter-order-btn {
          padding: 0.5rem;
          font-size: 1rem;
          border-radius: 0.5rem;
          background: #cee1fa;
          color: #fff;
          border: none;
          transition: background 0.2s;
          width: 38px;
          height: 38px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
        #sort-dropdown-menu {
            position: absolute;
            left: 0;
            right: 0;
            top: 110%;
            z-index: 40;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.09);
            width: auto;
            max-width: 100%;
            box-sizing: border-box;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 0.3rem;
            display: none;
        }
        #sort-dropdown-menu.show {
            display: block;
        }
        /* --- Search Bar Styles (leftmost) --- */
        /* Update the search container to use flex for alignment */
        .search-container {
            position: relative;
            width: 180px;
            min-width: 150px;
            flex: none;
            display: flex;
            align-items: center; /* This centers the input vertically */
            height: 38px; /* Match height of other components */
        }

        /* Update the search bar to remove any margin/padding that might affect alignment */
        .search-bar {
            width: 100%;
            height: 38px; /* Explicit height matching other components */
            padding: 0 0.75rem;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            background: #fff;
            color: #cee1fa;
            transition: all 0.2s;
            margin: 0; /* Remove any default margins */
            line-height: normal; /* Prevent line height from affecting vertical alignment */
        }

        /* Ensure the status message doesn't affect the layout */
        .status-message {
            position: absolute;
            bottom: -18px; /* Position below the search bar */
            left: 0;
            font-size: 12px;
            color: #6b7280;
            margin: 0;
            padding: 0;
        }

        /* Update suggestions container positioning */
        .suggestions {
            position: absolute;
            top: 100%; /* Position below the search container */
            left: 0;
            right: 0;
            margin-top: 2px;
            padding: 0; 
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            background: #fff;
            position: absolute;
            width: 100%;
            max-height: 170px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .suggestions li {
            padding: 8px 12px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .suggestions li:hover {
            background: #f0f0f0;
        }
        .status-message {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
            text-align: left;
            height: 16px;
            line-height: 16px;
        }
        @media (max-width: 640px) {
            .filter-floatbar {
                flex-direction: column;
                gap: 0.75rem;
                padding: 0.75rem;
            }
            .search-container {
                width: 100%;
                margin-right: 0;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-100 to-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <form id="filter-bar" class="filter-floatbar" autocomplete="off">
            <!-- Search (leftmost in bar) -->
            <div class="search-container">
                <input type="text" class="search-bar" id="property-search-bar" placeholder="Search..." autocomplete="off" disabled>
                <ul class="suggestions" id="property-search-suggestions"></ul>
                <div class="status-message" id="property-search-status"></div>
            </div>
            <div class="filter-group">
                <select id="type-filter" class="filter-select">
                    <option value="all">All Types</option>
                </select>
            </div>
            <div class="filter-group">
                <button id="sort-dropdown-btn" type="button" class="filter-select flex justify-between items-center">
                    <span id="sort-selected-label">Last Updated</span>
                    <i data-lucide="chevron-down" class="lucide h-4 w-4"></i>
                </button>
                <div id="sort-dropdown-menu">
                    <ul>
                        <li><button type="button" class="sort-option w-full px-4 py-2 text-left" data-sort="modified">Last Updated</button></li>
                        <li><button type="button" class="sort-option w-full px-4 py-2 text-left" data-sort="created">Created</button></li>
                        <li><button type="button" class="sort-option w-full px-4 py-2 text-left" data-sort="date">Date Listed</button></li>
                        <li><button type="button" class="sort-option w-full px-4 py-2 text-left" data-sort="price">Price</button></li>
                    </ul>
                </div>
            </div>
            <button id="order-toggle-btn" type="button" class="filter-order-btn" title="Toggle Sort Order">
                <span id="order-toggle-icon">⬇️</span>
            </button>
            <button id="reset-filters-button" type="button" class="filter-reset-btn">
                🔄
            </button>
        </form>
        <div id="status-message" class="text-center text-slate-500">Loading widget...</div>
        <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>
    <div id="modal-container" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div id="modal-backdrop" class="fixed inset-0 bg-black/80"></div>
        <div class="modal-content fixed left-1/2 top-1/2 w-full max-w-3xl -translate-x-1/2 -translate-y-1/2">
            <div class="relative max-h-[95vh] overflow-y-auto bg-white rounded-lg shadow-xl">
                <button id="modal-close-button" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600 z-10">
                    <svg class="lucide lucide-x h-6 w-6" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>
    <template id="property-card-template">
        <div class="group hover:shadow-lg transition-all duration-300 cursor-pointer flex flex-col bg-white rounded-lg border border-gray-200 overflow-hidden">
            <div class="relative overflow-hidden h-48">
                <img data-template-field="photo_url" alt="" class="w-full h-full object-cover object-center transform group-hover:scale-105 transition-transform duration-300">
                <div class="absolute top-2 left-2 z-10 days-chip-container"></div>
                <div class="absolute top-2 right-2 z-10 type-chip-container"></div>
                <div class="absolute bottom-0 left-0 right-0 h-14 bg-gradient-to-t from-black/70 to-transparent pointer-events-none"></div>
                <div class="absolute bottom-2 left-4 text-white z-10">
                    <p data-template-field="Property_Name" class="font-bold text-lg drop-shadow-md"></p>
                </div>
            </div>
            <div class="p-4 flex-grow flex flex-col">
                <p data-template-field="Address" class="text-sm text-gray-500 flex items-center gap-2 mt-1 truncate">
                    <i data-lucide="map-pin" class="lucide h-4 w-4 flex-shrink-0"></i>
                    <span class="truncate"></span>
                </p>
                <div class="mt-5 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <i data-lucide="dollar-sign" class="lucide h-5 w-5 text-green-500"></i>
                        <span data-template-field="Price" class="font-semibold text-gray-700"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <i data-lucide="trending-up" class="lucide h-5 w-5 text-blue-500"></i>
                        <span data-template-field="Cap_Rate" class="font-semibold text-gray-700"></span>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="modal-body-template">
        <div class="relative w-full">
            <img data-template-field="photo_url" class="w-full h-[320px] md:h-[400px] lg:h-[440px] object-cover object-center rounded-t-lg" style="background:#e7eaf1;" />
        </div>
        <div class="p-6 pb-2">
            <h2 data-template-field="Property_Name" class="text-2xl font-bold text-gray-800"></h2>
            <p data-template-field="Address" class="text-md text-gray-500 flex items-center gap-2 pt-1">
                <i data-lucide="map-pin" class="lucide h-4 w-4"></i>
                <span></span>
            </p>
        </div>
        <div class="px-6 pb-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            <div class="p-3 bg-slate-50 rounded-lg">
                <h4 class="text-sm text-gray-500">Price</h4>
                <p data-template-field="Price" class="font-bold text-lg text-green-600"></p>
            </div>
            <div class="p-3 bg-slate-50 rounded-lg">
                <h4 class="text-sm text-gray-500">Building Size</h4>
                <p data-template-field="RBA" class="font-bold text-lg"></p>
            </div>
            <div class="p-3 bg-slate-50 rounded-lg">
                <h4 class="text-sm text-gray-500">Cap Rate</h4>
                <p data-template-field="Cap_Rate" class="font-bold text-lg"></p>
            </div>
            <div class="p-3 bg-slate-50 rounded-lg">
                <h4 class="text-sm text-gray-500">Type</h4>
                <p data-template-field="Property_Type" class="font-bold text-lg"></p>
            </div>
        </div>
        <div class="px-6 pb-6">
            <h4 class="font-bold mb-2">Description</h4>
            <p data-template-field="Notes" class="text-sm text-gray-600"></p>
        </div>
        <div class="px-6 pb-6">
            <h4 class="font-bold mb-3">External Resources</h4>
            <div data-template-field="links" class="grid grid-cols-1 sm:grid-cols-3 gap-2"></div>
        </div>
    </template>
    <script type="module">
        let allRecords = [];
        let filteredRecords = [];
        let searchMatches = [];
        let searchActive = false;
        // Search settings
        let searchColumnName = "Property_Name";
        let isReady = false;

        const propertyGrid = document.getElementById('property-grid');
        const cardTemplate = document.getElementById('property-card-template');
        const statusMessage = document.getElementById('status-message');
        const modalContainer = document.getElementById('modal-container');
        const modalBody = document.getElementById('modal-body');
        const modalBodyTemplate = document.getElementById('modal-body-template');
        const typeFilterSelect = document.getElementById('type-filter');
        const resetButton = document.getElementById('reset-filters-button');
        const sortDropdownBtn = document.getElementById('sort-dropdown-btn');
        const sortDropdownMenu = document.getElementById('sort-dropdown-menu');
        const sortSelectedLabel = document.getElementById('sort-selected-label');
        const orderToggleBtn = document.getElementById('order-toggle-btn');
        const orderToggleIcon = document.getElementById('order-toggle-icon');
        const orderToggleLabel = document.getElementById('order-toggle-label');
        // Search DOM
        const searchInput = document.getElementById('property-search-bar');
        const suggestionsContainer = document.getElementById('property-search-suggestions');
        const searchStatus = document.getElementById('property-search-status');

        let sortState = {
            sortBy: 'modified', // 'modified', 'created', 'date', 'price'
            order: 'desc', // 'asc' or 'desc'
        };
        const sortLabels = {
            modified: 'Last Updated',
            created: 'Created',
            date: 'Date Listed',
            price: 'Price',
        };
        const formatters = {
            Price: (val) => val ? `$${Number(val).toLocaleString('en-US')}` : 'N/A',
            RBA: (val) => val ? `${Number(val).toLocaleString()} sq ft` : 'N/A',
            Cap_Rate: (val) => val ? `${(Number(val) * 100).toFixed(2)}%` : 'N/A',
            default: (val) => val || 'N/A',
        };
        function getDaysOnMarket(dateVal) {
            if (!dateVal) return null;
            let listedDate;
            if (typeof dateVal === "number") {
                listedDate = dateVal > 1e12 ? new Date(dateVal) : new Date(dateVal * 1000);
            } else if (typeof dateVal === "string") {
                let parsed = Date.parse(dateVal);
                if (!isNaN(parsed)) listedDate = new Date(parsed);
                else return null;
            } else if (dateVal instanceof Date) {
                listedDate = dateVal;
            } else {
                return null;
            }
            if (isNaN(listedDate?.getTime())) return null;
            const today = new Date();
            const diffTime = today - listedDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return 0;
            return diffDays;
        }
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                showCopied(button);
            }).catch(() => {
                const input = document.createElement('input');
                input.value = text;
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();
                try {
                    const successful = document.execCommand('copy');
                    document.body.removeChild(input);
                    if (successful) {
                        showCopied(button);
                    } else {
                        showCopyFailed(button, text);
                    }
                } catch (err) {
                    document.body.removeChild(input);
                    showCopyFailed(button, text);
                }
            });
            function showCopied(btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="check" class="lucide h-4 w-4 mr-2"></i> Copied!';
                lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    lucide.createIcons();
                }, 2000);
            }
            function showCopyFailed(btn, text) {
                btn.innerHTML = '<span style="color:red;">Copy not allowed</span>';
                setTimeout(() => {
                    btn.innerHTML = 'Copy OM Link';
                    lucide.createIcons();
                }, 3000);
                window.prompt('Copy this OM link manually:', text);
            }
        }
        function renderProperties(recordsToRender) {
            propertyGrid.innerHTML = '';
            if (!recordsToRender || recordsToRender.length === 0) {
                statusMessage.textContent = allRecords.length > 0 ? 'No properties match the current filters.' : 'No properties found in the table. Please add some data.';
                statusMessage.style.display = 'block';
                return;
            }
            statusMessage.style.display = 'none';
            recordsToRender.forEach((record, index) => {
                if (!record || typeof record !== 'object') return;
                const card = cardTemplate.content.cloneNode(true);
                const cardElement = card.firstElementChild;
                cardElement.style.animationDelay = `${index * 50}ms`;
                cardElement.classList.add('animate-fadeIn');
                // Days on Market overlay
                const daysChipContainer = cardElement.querySelector('.days-chip-container');
                const dom = getDaysOnMarket(record.Date_Listed);
                if (record.Date_Listed && dom !== null && !isNaN(dom)) {
                    const chip = document.createElement('span');
                    chip.className = 'img-overlay-chip';
                    chip.textContent = `${dom}d`;
                    daysChipContainer.appendChild(chip);
                }
                // Property Type overlay
                const typeChipContainer = cardElement.querySelector('.type-chip-container');
                if (record.Property_Type) {
                    const chip = document.createElement('span');
                    chip.className = 'img-overlay-chip';
                    chip.textContent = record.Property_Type;
                    typeChipContainer.appendChild(chip);
                }
                card.querySelectorAll('[data-template-field]').forEach(el => {
                    const field = el.dataset.templateField;
                    const value = record[field];
                    const formatter = formatters[field] || formatters.default;
                    if (field === 'Property_Name') {
                        el.textContent = formatter(value);
                        el.title = value;
                    } else if (field === 'photo_url') {
                        el.src = value || `https://placehold.co/600x400/e2e8f0/64748b?text=${encodeURIComponent(record.Property_Name || 'No Image')}`;
                        el.alt = record.Property_Name;
                    } else if (el.tagName === 'P' && el.querySelector('span')) {
                        el.querySelector('span').textContent = formatter(value);
                    } else {
                        el.textContent = formatter(value);
                    }
                });
                cardElement.addEventListener('click', () => showModal(record));
                propertyGrid.appendChild(card);
            });
            lucide.createIcons();
        }
        function showModal(record) {
            if (!record) return;
            const modalContent = modalBodyTemplate.content.cloneNode(true);
            modalContent.querySelectorAll('[data-template-field]').forEach(el => {
                const field = el.dataset.templateField;
                const value = record[field];
                const formatter = formatters[field] || formatters.default;
                if (field === 'links') {
                    const linksContainer = el;
                    linksContainer.innerHTML = '';
                    const linkButton = (url, icon, text) => `
                        <a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center rounded-md text-sm font-medium h-10 px-4 py-2 border border-slate-200 bg-white hover:bg-slate-50 transition">
                            <i data-lucide="${icon}" class="lucide h-4 w-4 mr-2"></i> ${text}
                        </a>`;
                    const copyButton = (filePath, icon, text) => `
                        <button data-copy-path="${filePath}" class="om-copy-button inline-flex items-center justify-center rounded-md text-sm font-medium h-10 px-4 py-2 border border-slate-200 bg-white hover:bg-slate-50 transition">
                            <i data-lucide="${icon}" class="lucide h-4 w-4 mr-2"></i> ${text}
                        </button>`;
                    if (record.CoStar) linksContainer.innerHTML += linkButton(record.CoStar, 'external-link', 'View on CoStar');
                    if (record.Crexi) linksContainer.innerHTML += linkButton(record.Crexi, 'external-link', 'View on Crexi');
                    if (record.OM) linksContainer.innerHTML += linkButton(record.OM, 'external-link', 'View OM');
                    if (record.OM) linksContainer.innerHTML += copyButton(record.OM, 'copy', 'Copy OM Link');
                    if (linksContainer.innerHTML === '') {
                        linksContainer.innerHTML = '<p class="text-sm text-gray-500 col-span-full">No external resources provided.</p>';
                    }
                } else if (field === 'photo_url') {
                    el.src = value || `https://placehold.co/800x600/e2e8f0/64748b?text=${encodeURIComponent(record.Property_Name || 'No Image')}`;
                    el.alt = record.Property_Name;
                } else if (el.tagName === 'P' && el.querySelector('span')) {
                    el.querySelector('span').textContent = formatter(value);
                } else {
                    el.textContent = formatter(value);
                }
            });
            modalBody.innerHTML = '';
            modalBody.appendChild(modalContent);
            modalBody.querySelectorAll('.om-copy-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    const path = e.currentTarget.dataset.copyPath;
                    copyToClipboard(path, e.currentTarget);
                });
            });
            modalContainer.classList.remove('hidden');
            modalContainer.classList.add('modal-open');
            lucide.createIcons();
        }
        function hideModal() {
            modalContainer.classList.add('hidden');
            modalContainer.classList.remove('modal-open');
            modalBody.innerHTML = '';
        }
        function populateTypeFilter(records) {
            const types = new Set(records.map(r => r.Property_Type).filter(Boolean).sort());
            while (typeFilterSelect.options.length > 1) {
                typeFilterSelect.remove(1);
            }
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                typeFilterSelect.appendChild(option);
            });
        }
        function sortRecords(records) {
            const { sortBy, order } = sortState;
            let sorted = [...records];
            if (sortBy === 'modified') {
                sorted.sort((a, b) => {
                    const am = a.Last_updated_at ? new Date(a.Last_updated_at) : new Date(0);
                    const bm = b.Last_updated_at ? new Date(b.Last_updated_at) : new Date(0);
                    return order === 'desc' ? bm - am : am - bm;
                });
            } else if (sortBy === 'created') {
                sorted.sort((a, b) => {
                    const ac = a.Created_at ? new Date(a.Created_at) : new Date(0);
                    const bc = b.Created_at ? new Date(b.Created_at) : new Date(0);
                    return order === 'desc' ? bc - ac : ac - bc;
                });
            } else if (sortBy === 'date') {
                sorted.sort((a, b) => {
                    const ad = a.Date_Listed ? new Date(a.Date_Listed) : new Date(0);
                    const bd = b.Date_Listed ? new Date(b.Date_Listed) : new Date(0);
                    return order === 'desc' ? bd - ad : ad - bd;
                });
            } else if (sortBy === 'price') {
                sorted.sort((a, b) => {
                    const ap = parseFloat(a.Price) || 0;
                    const bp = parseFloat(b.Price) || 0;
                    return order === 'desc' ? bp - ap : ap - bp;
                });
            }
            return sorted;
        }
        function applyFiltersAndRender() {
            // If a search is active, filter by search results first
            let baseRecords = searchActive ? searchMatches : allRecords;
            const typeFilterValue = typeFilterSelect.value;
            let filtered = [...baseRecords];
            if (typeFilterValue !== 'all') {
                filtered = filtered.filter(r => r.Property_Type === typeFilterValue);
            }
            filtered = sortRecords(filtered);
            filteredRecords = filtered; // for search highlight etc.
            renderProperties(filtered);
        }

        // --- Search Bar Functionality ---
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
        function updateSuggestions(matches) {
            suggestionsContainer.innerHTML = '';
            if (!searchInput.value.trim()) {
                suggestionsContainer.style.display = 'none';
                searchStatus.textContent = '';
                return;
            }
            if (matches.length > 0) {
                suggestionsContainer.style.display = 'block';
                searchStatus.textContent = '';
                matches.slice(0, 8).forEach(r => {
                    const li = document.createElement('li');
                    li.textContent = r[searchColumnName];
                    li.onclick = () => {
                        searchInput.value = r[searchColumnName];
                        suggestionsContainer.style.display = 'none';
                        // Filter grid to only this property
                        searchActive = true;
                        searchMatches = [r];
                        applyFiltersAndRender();
                    };
                    suggestionsContainer.appendChild(li);
                });
            } else {
                suggestionsContainer.style.display = 'none';
                searchStatus.textContent = 'No matches found.';
            }
        }
        const handleSearch = debounce(() => {
            if (!isReady) return;
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                searchActive = false;
                searchMatches = [];
                updateSuggestions([]);
                applyFiltersAndRender();
                return;
            }
            const matches = allRecords.filter(r => {
                if (!r.hasOwnProperty(searchColumnName)) return false;
                const val = r[searchColumnName];
                return val && typeof val === 'string' && val.toLowerCase().includes(query);
            });
            searchActive = true;
            searchMatches = matches;
            updateSuggestions(matches);
            applyFiltersAndRender();
        }, 250);

        searchInput.addEventListener('input', handleSearch);

        // Clicking outside suggestions hides the dropdown
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsContainer.style.display = 'none';
            }
        });

        // Reset search and filters
        resetButton.addEventListener('click', () => {
            typeFilterSelect.value = 'all';
            sortState.sortBy = 'modified';
            sortState.order = 'desc';
            sortSelectedLabel.textContent = sortLabels['modified'];
            orderToggleLabel.textContent = 'Descending';
            orderToggleIcon.setAttribute('data-lucide', 'arrow-down');
            searchInput.value = '';
            searchActive = false;
            searchMatches = [];
            searchStatus.textContent = '';
            suggestionsContainer.style.display = 'none';
            lucide.createIcons();
            applyFiltersAndRender();
        });

        // Dropdown logic
        sortDropdownBtn.addEventListener('click', (e) => {
            e.preventDefault();
            sortDropdownMenu.classList.toggle('show');
            lucide.createIcons();
        });
        document.addEventListener('click', (e) => {
            if (!sortDropdownBtn.contains(e.target) && !sortDropdownMenu.contains(e.target)) {
                sortDropdownMenu.classList.remove('show');
            }
        });
        sortDropdownMenu.querySelectorAll('.sort-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const sortKey = btn.dataset.sort;
                sortState.sortBy = sortKey;
                sortState.order = 'desc';
                sortSelectedLabel.textContent = sortLabels[sortKey];
                orderToggleLabel.textContent = 'Descending';
                orderToggleIcon.setAttribute('data-lucide', 'arrow-down');
                sortDropdownMenu.classList.remove('show');
                lucide.createIcons();
                applyFiltersAndRender();
            });
        });
        orderToggleBtn.addEventListener('click', () => {
            sortState.order = sortState.order === 'desc' ? 'asc' : 'desc';
            const toggleIcon = document.getElementById('order-toggle-icon');
            toggleIcon.textContent = sortState.order === 'desc' ? '⬇️' : '⬆️';
            applyFiltersAndRender();
        });
        typeFilterSelect.addEventListener('change', applyFiltersAndRender);

        document.getElementById('modal-close-button').addEventListener('click', hideModal);
        document.getElementById('modal-backdrop').addEventListener('click', hideModal);

        // --- Grist API and Bootstrapping ---
        grist.ready({ requiredAccess: 'read table' });
        grist.onRecords((records) => {
            allRecords = records;
            isReady = true;
            populateTypeFilter(records);
            searchInput.disabled = false;
            // Set placeholder based on column
            if (searchColumnName && searchColumnName !== 'Property_Name') {
                searchInput.placeholder = `Search ${searchColumnName}...`;
            }
            applyFiltersAndRender();
        });
        // Optional: support grist widget option for search column
        grist.onOptions((options) => {
            if (options && options.searchColumn) {
                searchColumnName = options.searchColumn;
                searchInput.placeholder = `Search ${searchColumnName}...`;
            }
        });
    </script>
</body>
</html>
