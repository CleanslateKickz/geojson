<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Owner Search Widget</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    /* --- NEW COMPACT STYLES --- */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background-color: #f5f5f5;
      
      /* Use flexbox to perfectly center the search bar without large padding */
      display: flex;
      align-items: center; /* Vertical centering */
      justify-content: center; /* Horizontal centering */
      min-height: 100vh; /* Ensure body takes full height for centering */
      margin: 0;
      padding: 4px; /* Minimal padding to prevent touching edges */
      box-sizing: border-box;
      overflow: hidden; /* Prevent any potential scrollbars */
    }
    .search-container { 
      position: relative; 
      width: 100%;
      max-width: 400px; 
    }
    .search-bar { 
      width: 100%; 
      padding: 8px 12px; /* Reduced padding for a more compact field */
      font-size: 14px; /* Slightly smaller font */
      border: 1px solid #d1d5db; /* A softer gray for the border */
      border-radius: 6px; 
      outline: none; 
      background: #fff; 
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-bar:disabled { 
      background-color: #e9ecef; 
      cursor: not-allowed; 
    }
    .search-bar:focus { 
      border-color: #007bff; 
      box-shadow: 0 0 0 2px rgba(0,123,255,.15); /* Subtler focus ring */
    }
    .suggestions { 
      list-style: none; 
      margin: 2px 0 0; /* Tighter spacing below the search bar */
      padding: 0; 
      border: 1px solid #d1d5db;
      border-radius: 6px; 
      background: #fff; 
      position: absolute; 
      width: 100%; 
      max-height: 200px; 
      overflow-y: auto; 
      z-index: 1000; 
      display: none; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .suggestions li { 
      padding: 8px 12px; /* Match the search bar padding */
      font-size: 14px; /* Match the search bar font size */
      cursor: pointer; 
    }
    .suggestions li:hover { 
      background: #f0f0f0; 
    }
    .status-message { 
      font-size: 12px; /* Smaller status message font */
      color: #6b7280; 
      margin-top: 4px; /* Tighter margin */
      text-align: center; 
      height: 16px; /* Reserve space to prevent layout shift */
      line-height: 16px;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Loading..." disabled>
    <ul class="suggestions"></ul>
    <div class="status-message"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      let allRecords = [];
      let searchColumnName = "Name"; // Default column
      let isReady = false;

      const searchInput = document.querySelector('.search-bar');
      const suggestionsContainer = document.querySelector('.suggestions');
      const statusMessageEl = document.querySelector('.status-message');

      function debounce(func, wait) {
        let timeout;
        return function(...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      grist.ready({
        requiredAccess: 'full',
        columns: [{
          name: 'searchColumn',
          title: 'Search Column',
          type: 'Text',
          optional: false
        }],
        selection: true,
        allowSelectBy: true
      });
      
      isReady = true;

      grist.onOptions((options) => {
        if (options && options.searchColumn) {
          searchColumnName = options.searchColumn;
          searchInput.placeholder = `Search ${searchColumnName}...`;
        }
      });

      grist.onRecords((records) => {
        allRecords = records || [];
        if (isReady) {
          searchInput.disabled = false;
          if (!searchInput.placeholder.includes('Search')) {
            searchInput.placeholder = `Search ${searchColumnName}...`;
          }
        }
      });

      const handleSearch = debounce(() => {
        if (!searchColumnName || !isReady) { 
          return; 
        }
        
        const query = searchInput.value.trim().toLowerCase();
        suggestionsContainer.innerHTML = '';
        
        if (!query) {
          suggestionsContainer.style.display = 'none';
          statusMessageEl.textContent = '';
          return;
        }

        const matches = allRecords.filter(r => {
          if (!r.hasOwnProperty(searchColumnName)) return false;
          const val = r[searchColumnName];
          return val && typeof val === 'string' && val.toLowerCase().includes(query);
        });

        if (matches.length > 0) {
          suggestionsContainer.style.display = 'block';
          statusMessageEl.textContent = '';
          
          matches.forEach(r => {
            const li = document.createElement('li');
            li.textContent = r[searchColumnName];
            li.onclick = () => {
              searchInput.value = r[searchColumnName];
              suggestionsContainer.style.display = 'none';
              grist.setCursorPos({ rowId: r.id });
              grist.setSelectedRows([{ id: r.id }]);
            };
            suggestionsContainer.appendChild(li);
          });
        } else {
          suggestionsContainer.style.display = 'none';
          statusMessageEl.textContent = 'No matches found.';
        }
      }, 300);

      searchInput.addEventListener('input', handleSearch);
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
          suggestionsContainer.style.display = 'none';
        }
      });

      grist.onRecord((record) => {
        if (record && record[searchColumnName] && isReady) {
          if (searchInput.value !== record[searchColumnName]) {
            searchInput.value = record[searchColumnName];
          }
        } else if (!record && isReady) {
          searchInput.value = '';
        }
      });
    });
  </script>
</body>
</html>
